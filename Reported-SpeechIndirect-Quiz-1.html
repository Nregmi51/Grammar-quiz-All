/* -------------  QUIZ LOGIC  ------------- */
let currentSet = 0;
const SETS = []; // 13 sets × 7 questions
for (let i = 0; i < 13; i++) SETS.push(ALL.slice(i*7, i*7+7));
let userAnswers = [];
let scores = [];

const container = document.getElementById('questionContainer');
const progress = document.getElementById('progress');
const setTitle = document.getElementById('setTitle');
const submitBtn = document.getElementById('submitBtn');
const setResult = document.getElementById('setResult');
const navButtons = document.getElementById('navButtons');

function renderSet(setIdx){
    container.innerHTML='';
    userAnswers[setIdx]=Array(SETS[setIdx].length).fill(null);
    setTitle.textContent=`Set ${setIdx+1} / 13`;
    progress.value=setIdx;
    SETS[setIdx].forEach((qObj,i)=>{
        const qDiv=document.createElement('div');
        qDiv.className='qBox';
        qDiv.innerHTML=`
            <div class="qText">${i+1}. ${qObj.q}</div>
            ${qObj.options.map((opt,idx)=>`
                <label class="option">
                    <input type="radio" name="q${i}" value="${idx}">
                    ${opt}
                </label>`).join('')}
        `;
        container.appendChild(qDiv);
    });
    submitBtn.disabled=true;
    setResult.textContent='';
    navButtons.style.display='none';
    container.addEventListener('change',()=>{
        const answered=[...container.querySelectorAll('input[type=radio]:checked')].length;
        submitBtn.disabled = answered < SETS[setIdx].length;
    });
}

function submitSet(){
    const setIdx=currentSet;
    const radios=[...container.querySelectorAll('input[type=radio]:checked')];
    radios.forEach((r,i)=>userAnswers[setIdx][i]=parseInt(r.value));
    let correct=0;
    SETS[setIdx].forEach((q,i)=>{
        const labels=document.querySelectorAll(`input[name=q${i}] + .option`);
        const sel=userAnswers[setIdx][i];
        labels.forEach((l,idx)=>{
            if(idx===q.answer) l.classList.add('correct');
            else if(idx===sel) l.classList.add('wrong');
        });
    });
    correct=userAnswers[setIdx].reduce((c,a,i)=>c+(a===SETS[setIdx][i].answer?1:0),0);
    scores[setIdx]=correct;
    setResult.textContent=`Set ${setIdx+1} Result: ${correct}/${SETS[setIdx].length}`;
    submitBtn.disabled=true;
    navButtons.style.display='block';
}
function nextSet(){
    currentSet++;
    if(currentSet<SETS.length) renderSet(currentSet);
    else showSummary();
}
function retrySet(){ renderSet(currentSet); }
function showSummary(){
    document.getElementById('quizArea').style.display='none';
    document.getElementById('summary').style.display='block';
    progress.value=SETS.length;
    const ul=document.getElementById('summaryList');
    ul.innerHTML='';
    let total=0,max=0;
    scores.forEach((s,i)=>{
        const m=SETS[i].length;
        ul.innerHTML+=`<li>Set ${i+1}: ${s}/${m}</li>`;
        total+=s; max+=m;
    });
    ul.innerHTML+=`<li><strong>Total: ${total}/${max} (${Math.round(total/max*100)}%)</strong></li>`;
}
function restartQuiz(){
    currentSet=0; scores=[]; userAnswers=[];
    document.getElementById('quizArea').style.display='block';
    document.getElementById('summary').style.display='none';
    renderSet(0);
}
submitBtn.onclick=submitSet;
document.getElementById('retryBtn').onclick=retrySet;
document.getElementById('nextBtn').onclick=nextSet;
renderSet(0);
</script>
