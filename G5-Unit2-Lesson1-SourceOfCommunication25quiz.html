<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📡 ICT Quiz for Kids</title>
    <style>
        /* ----- Global Reset & Font ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #e8f0fe 0%, #d4e4f7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .quiz-container {
            max-width: 820px;
            width: 100%;
            background: rgba(255, 252, 248, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15), 0 8px 16px rgba(0, 0, 0, 0.08);
            padding: 2rem 1.8rem 2.2rem;
            border: 3px solid #b8d4f0;
            transition: all 0.2s;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #1a2a4a;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            letter-spacing: 1px;
        }
        h1 span {
            background: #4a8bc2;
            color: white;
            padding: 0.2rem 1.5rem;
            border-radius: 60px;
            font-size: 1.6rem;
            box-shadow: inset 0 -4px 0 #1a5a8a;
            font-weight: 800;
        }
        .subhead {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a3a5a;
            margin-top: -0.2rem;
            margin-bottom: 1.2rem;
            background: #c5ddf5;
            display: inline-block;
            padding: 0.3rem 2rem;
            border-radius: 40px;
            letter-spacing: 1px;
        }
        /* progress */
        .progress-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #c5ddf5;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 1.2rem;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1a2a4a;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .score-badge {
            background: #f7d44a;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #1a2a4a;
        }
        .progress-bar-bg {
            width: 100%;
            height: 16px;
            background: #aac3dd;
            border-radius: 30px;
            margin-top: 0.3rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a8bc2, #1a6aaa);
            border-radius: 30px;
            transition: width 0.3s ease;
        }
        /* question card */
        .question-card {
            background: #ffffff;
            border-radius: 50px;
            padding: 2rem 1.8rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05), 0 8px 0 #aac3dd;
            border: 2px solid #b8d4f0;
            margin-bottom: 1.2rem;
        }
        .question-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .question-number-circle {
            background: #1a3a5a;
            color: #ffffff;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            font-weight: 900;
            box-shadow: 0 6px 0 #0a1a2a, 0 8px 16px rgba(0,0,0,0.15);
            flex-shrink: 0;
            border: 3px solid #f7d44a;
        }
        .question-emoji {
            font-size: 3.8rem;
            line-height: 1;
        }
        .question-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a2a4a;
            line-height: 1.4;
            margin-bottom: 1.8rem;
            text-align: center;
            padding: 0 0.5rem;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .option-btn {
            background: #f0f5fc;
            border: 3px solid #b8d4f0;
            border-radius: 60px;
            padding: 1rem 1.5rem;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: left;
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 #8aaccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #1a2a4a;
            touch-action: manipulation;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #8aaccc;
        }
        .option-btn .opt-label {
            display: inline-block;
            background: #4a8bc2;
            color: white;
            border-radius: 40px;
            padding: 0 1rem;
            font-size: 1.3rem;
            font-weight: 800;
            min-width: 2.6rem;
            text-align: center;
            line-height: 2.2rem;
        }
        .option-btn .opt-icon {
            font-size: 1.8rem;
        }
        .option-btn.correct {
            background: #b1d8b1;
            border-color: #2e7d32;
            box-shadow: 0 5px 0 #1e5a22;
        }
        .option-btn.wrong {
            background: #f8b5b5;
            border-color: #b13030;
            box-shadow: 0 5px 0 #7a2222;
        }
        .option-btn.disabled {
            opacity: 0.6;
            cursor: default;
        }
        .option-btn.disabled:active {
            transform: none;
            box-shadow: 0 5px 0 #8aaccc;
        }
        .feedback {
            margin-top: 1.4rem;
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            padding: 0.8rem;
            border-radius: 60px;
            background: #f0f5fc;
            transition: background 0.2s;
            min-height: 4.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* navigation */
        .nav-area {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
            align-items: center;
        }
        .btn {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            border: none;
            border-radius: 60px;
            background: #f7b731;
            color: #1a2a4a;
            font-weight: 800;
            font-size: 1.4rem;
            box-shadow: 0 6px 0 #b87d1c;
            transition: all 0.08s ease;
            cursor: pointer;
            text-align: center;
            touch-action: manipulation;
            border: 2px solid #fad88a;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #b87d1c;
        }
        .btn-restart {
            background: #e07b6e;
            box-shadow: 0 6px 0 #9e4f44;
            border-color: #f0a99e;
            color: white;
        }
        .btn-success {
            background: #5fad6b;
            box-shadow: 0 6px 0 #357a3f;
            border-color: #8fcb99;
            color: white;
        }
        .btn-start {
            background: #4a8bc2;
            box-shadow: 0 6px 0 #1a5a8a;
            border-color: #7ab0e8;
            color: white;
        }
        /* dropdown */
        .dropdown-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            background: #f0f5fc;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            border: 2px solid #b8d4f0;
        }
        .dropdown-area label {
            font-weight: 700;
            font-size: 1.2rem;
            color: #1a2a4a;
        }
        .dropdown-area select {
            padding: 0.5rem 1rem;
            border-radius: 40px;
            border: 2px solid #8aaccc;
            font-size: 1.2rem;
            font-weight: 700;
            background: white;
            color: #1a2a4a;
            cursor: pointer;
            outline: none;
        }
        .dropdown-area select:focus {
            border-color: #1a3a5a;
            box-shadow: 0 0 0 3px rgba(26, 58, 90, 0.2);
        }
        /* result */
        .result-box {
            text-align: center;
            padding: 1.8rem 1rem;
        }
        .result-box .big-emoji {
            font-size: 6rem;
        }
        .result-box .score-big {
            font-size: 4.5rem;
            font-weight: 900;
            color: #1a2a4a;
            background: #f7d44a;
            display: inline-block;
            padding: 0.3rem 2rem;
            border-radius: 60px;
            margin: 0.5rem 0;
            box-shadow: 0 6px 0 #c79a2e;
        }
        .result-box .message {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0.8rem 0;
        }
        .result-box .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.2rem;
        }
        .result-box .perf-detail {
            font-size: 2rem;
            font-weight: 800;
            color: #1a2a4a;
            background: #c5ddf5;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            display: inline-block;
            margin: 0.5rem 0;
        }
        /* hide */
        .hidden {
            display: none !important;
        }
        /* responsive */
        @media (max-width: 500px) {
            .quiz-container { padding: 1.2rem 1rem; }
            h1 { font-size: 2.2rem; }
            .question-text { font-size: 1.5rem; }
            .option-btn { font-size: 1.2rem; padding: 0.8rem 1.2rem; }
            .feedback { font-size: 1.4rem; }
            .btn { font-size: 1.2rem; padding: 0.7rem 1.5rem; }
            .progress-area { font-size: 1rem; }
            .score-badge { font-size: 1.1rem; padding: 0.2rem 1rem; }
            .question-number-circle { width: 55px; height: 55px; font-size: 1.8rem; }
            .question-emoji { font-size: 2.8rem; }
            .result-box .score-big { font-size: 3.2rem; }
            .result-box .perf-detail { font-size: 1.4rem; }
            .dropdown-area select { font-size: 1rem; padding: 0.4rem 0.8rem; }
        }
        .auto-timer {
            font-size: 0.9rem;
            color: #4a6a8a;
            text-align: center;
            margin-top: 0.5rem;
            font-weight: 600;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizApp">
    <!-- Header -->
    <div style="display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 0.3rem;">
        <h1>📡 ICT <span>Quiz</span></h1>
    </div>
    <div style="text-align: center;">
        <span class="subhead">🌟 Grade 5 · Information & Communication</span>
    </div>

    <!-- Progress -->
    <div class="progress-area">
        <span class="score-badge" id="scoreDisplay">⭐ 0</span>
        <span style="font-weight:700;">Progress</span>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
        </div>
    </div>

    <!-- Question Card -->
    <div id="questionCard" class="question-card">
        <div class="question-header">
            <div class="question-number-circle" id="questionNumber">1</div>
            <div class="question-emoji" id="questionEmoji">📡</div>
        </div>
        <div class="question-text" id="questionText">Loading question...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback" id="feedbackDisplay">💡 Pick an answer!</div>
        <div class="auto-timer" id="autoTimer">⏳ Waiting for your answer...</div>
    </div>

    <!-- Navigation -->
    <div class="nav-area">
        <div class="dropdown-area">
            <label for="questionCountSelect">📝 Questions:</label>
            <select id="questionCountSelect">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="25">25 (All)</option>
            </select>
            <button class="btn btn-start" id="startQuizBtn">🚀 Start</button>
        </div>
        <button class="btn btn-restart" id="restartBtn">🔄 Restart</button>
    </div>

    <!-- Result Screen (hidden initially) -->
    <div id="resultScreen" class="result-box hidden">
        <div class="big-emoji">🎉</div>
        <div class="score-big" id="finalScore">0 / 10</div>
        <div class="perf-detail" id="perfDetail">You made 0 correct out of 10</div>
        <div class="message" id="finalMessage">Great job!</div>
        <div class="btn-group">
            <button class="btn btn-success" id="retryBtn">🔄 Try Again</button>
        </div>
    </div>
</div>
<script>
    (function() {
        // ---------- ALL QUESTIONS (25) ----------
        const allQuestions = [
            // Textbook questions (1-5)
            { 
                q: 'Which type of communication takes place during a conversation between friends?',
                options: ['Mass communication', 'Internal communication', 'Personal communication', 'Interpersonal communication'],
                correctIndex: 3,
                emoji: '💬'
            },
            { 
                q: 'Which is a means of mass communication used in daily life?',
                options: ['Letter', 'Telephone', 'Radio', 'Email'],
                correctIndex: 2,
                emoji: '📻'
            },
            { 
                q: 'Which one is a one-way communication?',
                options: ['Interpersonal communication', 'Mass communication', 'Discussion program', 'Telephone conversation'],
                correctIndex: 1,
                emoji: '📢'
            },
            { 
                q: 'What type of communication is the use of a red or yellow card by a referee in football?',
                options: ['Audible', 'Audiovisual', 'Symbolic', 'Written'],
                correctIndex: 2,
                emoji: '🟨'
            },
            { 
                q: 'In the scenario: Binu is reading a book, Bibek is talking on the phone, parents are listening to radio news. Which is interpersonal communication?',
                options: ['Binu reading a book', 'The news on the radio', 'Bibek talking on the telephone', 'Parents listening to radio'],
                correctIndex: 2,
                emoji: '📞'
            },
            // Additional questions (6-25)
            { 
                q: 'What do we call the facts and data collected from our environment?',
                options: ['Stories', 'Information', 'Music', 'Dreams'],
                correctIndex: 1,
                emoji: '📊'
            },
            { 
                q: 'Sources of information obtained directly from observation are called:',
                options: ['Secondary sources', 'Primary sources', 'Fake sources', 'Hidden sources'],
                correctIndex: 1,
                emoji: '🔍'
            },
            { 
                q: 'Which device allows us to acquire information by both hearing and seeing?',
                options: ['Radio', 'Newspaper', 'Television', 'Telephone'],
                correctIndex: 2,
                emoji: '📺'
            },
            { 
                q: 'Which is described as a modern, easy, and convenient source of information?',
                options: ['Handwritten letter', 'Mobile phone', 'Pigeon post', 'Smoke signals'],
                correctIndex: 1,
                emoji: '📱'
            },
            { 
                q: 'What tool did Roshni use on her father\'s mobile to find the way to Pathivara Devi Temple?',
                options: ['Google maps', 'Calculator', 'Game app', 'Music player'],
                correctIndex: 0,
                emoji: '🗺️'
            },
            { 
                q: 'According to the case study, how did the Aunt send the photo of the invitation card immediately?',
                options: ['By post office', 'Using the internet', 'By hand delivery', 'Through the radio'],
                correctIndex: 1,
                emoji: '📸'
            },
            { 
                q: 'In the past, why did people gather at the "army uncle\'s house" in the case study?',
                options: ['To eat dinner', 'To listen to the radio', 'To watch TV', 'To play games'],
                correctIndex: 1,
                emoji: '📻'
            },
            { 
                q: 'The transmission of information from one place to another is called:',
                options: ['Transportation', 'Communication', 'Observation', 'Experimentation'],
                correctIndex: 1,
                emoji: '📡'
            },
            { 
                q: 'When a person internally thinks and reaches a conclusion, it is called:',
                options: ['Intrapersonal communication', 'Interpersonal communication', 'Mass communication', 'Symbolic communication'],
                correctIndex: 0,
                emoji: '🧠'
            },
            { 
                q: 'Which type of communication involves a two-way flow of information between people?',
                options: ['Internal communication', 'Interpersonal communication', 'One-way communication', 'Silent communication'],
                correctIndex: 1,
                emoji: '🔄'
            },
            { 
                q: 'Radio, television, and online magazines are examples of which type of communication?',
                options: ['Personal communication', 'Mass communication', 'Internal communication', 'Private communication'],
                correctIndex: 1,
                emoji: '📡'
            },
            { 
                q: 'What do we call communication that is done through symbols, like nodding your head?',
                options: ['Written communication', 'Non-verbal (symbolic) communication', 'Audible communication', 'Oral communication'],
                correctIndex: 1,
                emoji: '🤝'
            },
            { 
                q: 'Joining two hands (Namaskar) is a symbolic way to communicate what?',
                options: ['Goodbye', 'Hello (Greeting)', 'I am hungry', 'Stop'],
                correctIndex: 1,
                emoji: '🙏'
            },
            { 
                q: 'Who is known as the "Father of the computer"?',
                options: ['Isaac Newton', 'Charles Babbage', 'Albert Einstein', 'Thomas Edison'],
                correctIndex: 1,
                emoji: '💻'
            },
            { 
                q: 'When Pemba observed the avalanche and thought about it, where was the information communicated first?',
                options: ['To his friend', 'To his brain', 'To the radio', 'To a newspaper'],
                correctIndex: 1,
                emoji: '🧠'
            },
            { 
                q: 'Which mobile application serves as a source for finding the meanings of words?',
                options: ['Calendar', 'Dictionary', 'Watch', 'Phone diary'],
                correctIndex: 1,
                emoji: '📖'
            },
            { 
                q: 'What tool provides information about the dates and months of the year?',
                options: ['Magnetic needle', 'Calendar', 'Book', 'Radio'],
                correctIndex: 1,
                emoji: '📅'
            },
            { 
                q: 'A traffic light turning red to mean "Stop" is an example of:',
                options: ['Symbolic communication', 'Written communication', 'Oral communication', 'Internal communication'],
                correctIndex: 0,
                emoji: '🚦'
            },
            { 
                q: 'In mass communication, the flow of information is generally:',
                options: ['Two-way', 'One-way', 'Circular', 'Stopped'],
                correctIndex: 1,
                emoji: '➡️'
            },
            { 
                q: 'Information can be communicated in which of the following forms?',
                options: ['Verbal and non-verbal', 'Written', 'Audio-visual', 'All of the above'],
                correctIndex: 3,
                emoji: '📋'
            }
        ];

        // ----- DOM refs -----
        const questionCard = document.getElementById('questionCard');
        const questionNumber = document.getElementById('questionNumber');
        const questionEmoji = document.getElementById('questionEmoji');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackDisplay = document.getElementById('feedbackDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const progressFill = document.getElementById('progressFill');
        const restartBtn = document.getElementById('restartBtn');
        const startBtn = document.getElementById('startQuizBtn');
        const questionCountSelect = document.getElementById('questionCountSelect');
        const resultScreen = document.getElementById('resultScreen');
        const finalScore = document.getElementById('finalScore');
        const perfDetail = document.getElementById('perfDetail');
        const finalMessage = document.getElementById('finalMessage');
        const retryBtn = document.getElementById('retryBtn');
        const autoTimer = document.getElementById('autoTimer');

        // ----- State -----
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let timer = null;
        let isFinished = false;
        let totalQuestions = 0;

        // ----- Functions -----
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            if (timer) clearTimeout(timer);
            const count = parseInt(questionCountSelect.value);
            const shuffled = shuffleArray([...allQuestions]);
            currentQuestions = shuffled.slice(0, count);
            totalQuestions = currentQuestions.length;
            currentIndex = 0;
            score = 0;
            answered = false;
            isFinished = false;
            resultScreen.classList.add('hidden');
            questionCard.classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            if (isFinished || currentIndex >= totalQuestions) {
                showResult();
                return;
            }
            resultScreen.classList.add('hidden');
            questionCard.classList.remove('hidden');
            if (timer) clearTimeout(timer);

            const q = currentQuestions[currentIndex];
            questionNumber.textContent = currentIndex + 1;
            questionEmoji.textContent = q.emoji || '📡';
            questionText.textContent = q.q;
            scoreDisplay.textContent = `⭐ ${score}`;
            const pct = ((currentIndex) / totalQuestions) * 100;
            progressFill.style.width = pct + '%';

            optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-label">${labels[idx]}</span> <span class="opt-icon">${getOptionIcon(idx)}</span> ${opt}`;
                btn.dataset.idx = idx;
                btn.addEventListener('click', optionClickHandler);
                optionsContainer.appendChild(btn);
            });

            feedbackDisplay.textContent = '💡 Pick an answer!';
            feedbackDisplay.style.background = '#f0f5fc';
            autoTimer.textContent = `⏳ Question ${currentIndex+1} of ${totalQuestions} · Waiting for your answer...`;
            autoTimer.style.opacity = '0.7';
            answered = false;
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('disabled', 'correct', 'wrong');
                b.disabled = false;
                b.style.opacity = '1';
            });
        }

        function getOptionIcon(idx) {
            const icons = ['🔴', '🔵', '🟢', '🟡'];
            return icons[idx] || '⚪';
        }

        function optionClickHandler(e) {
            if (answered || isFinished) return;
            const btn = e.currentTarget;
            const selectedIdx = parseInt(btn.dataset.idx);
            const q = currentQuestions[currentIndex];
            const correct = selectedIdx === q.correctIndex;

            document.querySelectorAll('.option-btn').forEach(b => {
                b.disabled = true;
                b.classList.add('disabled');
            });

            document.querySelectorAll('.option-btn').forEach((b, i) => {
                if (i === q.correctIndex) b.classList.add('correct');
                else if (i === selectedIdx && !correct) b.classList.add('wrong');
            });

            if (correct) {
                score++;
                feedbackDisplay.textContent = '✅ Correct! Well done! 🎉';
                feedbackDisplay.style.background = '#b8e0b8';
            } else {
                feedbackDisplay.textContent = `❌ Oops! The right answer was ${['A','B','C','D'][q.correctIndex]}.`;
                feedbackDisplay.style.background = '#f8c8c8';
            }
            answered = true;
            scoreDisplay.textContent = `⭐ ${score}`;

            if (currentIndex === totalQuestions - 1) {
                autoTimer.textContent = '🏁 Quiz complete! Showing results...';
                autoTimer.style.opacity = '1';
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => {
                    showResult();
                }, 1500);
                return;
            }

            autoTimer.textContent = `⏳ Moving to next question in 1.5 seconds... (${currentIndex+1}/${totalQuestions})`;
            autoTimer.style.opacity = '1';
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => {
                currentIndex++;
                renderQuestion();
            }, 1500);
        }

        function showResult() {
            isFinished = true;
            questionCard.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScore.textContent = `${score} / ${totalQuestions}`;
            perfDetail.textContent = `You made ${score} correct out of ${totalQuestions}`;
            const pct = (score / totalQuestions) * 100;
            let msg = '';
            let emoji = '';
            if (pct === 100) { msg = '🌟 Perfect! You\'re a Tech Star!'; emoji = '🏆'; }
            else if (pct >= 80) { msg = '🎉 Excellent! Keep it up!'; emoji = '🌟'; }
            else if (pct >= 60) { msg = '👍 Good job! You know a lot!'; emoji = '😊'; }
            else if (pct >= 40) { msg = '📖 Keep learning, you\'re getting there!'; emoji = '💪'; }
            else { msg = '🤔 Let\'s review and try again!'; emoji = '🔁'; }
            finalMessage.textContent = `${emoji} ${msg}`;
            progressFill.style.width = '100%';
            scoreDisplay.textContent = `⭐ ${score}`;
        }

        function restartQuiz() {
            if (timer) clearTimeout(timer);
            startQuiz();
        }

        // ----- Event Listeners -----
        startBtn.addEventListener('click', startQuiz);
        restartBtn.addEventListener('click', restartQuiz);
        retryBtn.addEventListener('click', restartQuiz);

        // ----- Initialize with default 10 questions -----
        startQuiz();
    })();
</script>
</body>
</html>
