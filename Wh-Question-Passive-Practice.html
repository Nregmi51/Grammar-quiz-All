<style>

  :root{

    --indigo-d:#3730a3;
    --green:#16a34a;
    --green-l:#dcfce7;
    --red:#dc2626;
    --red-l:#fee2e2;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --card:#ffffff;
  }
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:linear-gradient(140deg,#1e1b4b 0%,#312e81 40%,#4338ca 100%);
    min-height:100vh;
    color:var(--ink);
    padding-bottom:40px;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.3);
    box-shadow:0 6px 24px rgba(15,23,42,.18);
    padding:12px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto;}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;font-weight:800;font-size:1.05rem;
    display:grid;place-items:center;
    box-shadow:0 6px 16px rgba(99,102,241,.45);
    letter-spacing:.5px;
  }
  .brand h1{font-size:1.18rem;font-weight:800;letter-spacing:.3px;color:#1e1b4b;}
  .brand p{font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.4px;}

  .stats{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    display:flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:999px;
    font-size:.8rem;font-weight:700;
    background:#f1f5f9;color:#334155;
    border:1.5px solid var(--line);
    transition:.2s;
  }
  .chip b{font-size:.92rem;}
  .chip.ok{background:var(--green-l);border-color:#86efac;color:#15803d;}
  .chip.no{background:var(--red-l);border-color:#fca5a5;color:#b91c1c;}
  .chip.sc{background:#eef2ff;border-color:#c7d2fe;color:#4338ca;}

  .review-btn{
    padding:10px 16px;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff;font-weight:700;font-size:.85rem;
    display:flex;align-items:center;gap:7px;
    box-shadow:0 5px 14px rgba(79,70,229,.4);
    transition:.18s;
  }
  .review-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(79,70,229,.5);}
  .review-btn.active{background:linear-gradient(135deg,#0f172a,#334155);}

  /* ---------- MAIN ---------- */
  .wrap{max-width:820px;margin:26px auto;padding:0 16px;}

  .progress-shell{
    background:rgba(255,255,255,.18);
    border-radius:999px;height:10px;overflow:hidden;
    margin-bottom:14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.2);
  }
  .progress-fill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#34d399,#22d3ee,#818cf8);
    transition:width .35s ease;
  }

  .qmeta{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:12px;
    color:#e0e7ff;font-size:.82rem;font-weight:700;letter-spacing:.4px;

    color:#fff;padding:5px 12px;border-radius:999px;font-size:.74rem;

    color:#1e1b4b;margin-bottom:20px;
    padding-left:14px;border-left:5px solid #6366f1;

  .options{display:flex;flex-direction:column;gap:11px;}
  .option{

    padding:14px 16px;border-radius:15px;
    border:2px solid var(--line);background:#fff;
    cursor:pointer;text-align:left;
    font-size:1rem;font-family:inherit;color:#1e293b;
    line-height:1.45;
    transition:all .16s ease;
    position:relative;
  }
  .option:hover:not(.disabled){
    border-color:#818cf8;background:#f5f3ff;
    transform:translateX(5px);
    box-shadow:0 6px 16px rgba(99,102,241,.16);
  }
  .option .key{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:#eef2ff;color:#4f46e5;
    font-weight:800;font-size:.88rem;
    display:grid;place-items:center;
    transition:.16s;
  }
  .option.disabled{cursor:default;}
  .option.correct{background:var(--green-l);border-color:#22c55e;}
  .option.correct .key{background:var(--green);color:#fff;}
  .option.wrong{background:var(--red-l);border-color:#ef4444;}
  .option.wrong .key{background:var(--red);color:#fff;}
  .option.wrong{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(3px);}
  }
  .option.correct::after{
    content:"✓";position:absolute;right:16px;top:50%;
    transform:translateY(-50%);color:var(--green);
    font-weight:900;font-size:1.15rem;
  }
  .option.wrong::after{
    content:"✕";position:absolute;right:16px;top:50%;
    transform:translateY(-50%);color:var(--red);
    font-weight:900;font-size:1.15rem;
  }

  .feedback{
    margin-top:16px;min-height:26px;
    font-weight:800;font-size:.95rem;
    display:flex;align-items:center;gap:8px;
    opacity:0;transform:translateY(6px);
    transition:.22s;
  }
  .feedback.show{opacity:1;transform:none;}
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--red);}

  .timerbar{
    position:absolute;left:0;bottom:0;height:5px;width:0%;
    background:linear-gradient(90deg,#34d399,#22d3ee);
    border-radius:0 4px 4px 0;
  }

  .result{text-align:center;padding:36px 26px;}
  .result .ring{
    width:150px;height:150px;margin:0 auto 18px;
    border-radius:50%;
    display:grid;place-items:center;
    background:conic-gradient(#6366f1 var(--pct,0%), #e2e8f0 0);

  .result .ring::before{

  }
  .result .ring span{
    position:relative;font-size:2rem;font-weight:900;color:#4338ca;

  .result .grade{font-size:1.05rem;font-weight:800;color:#4f46e5;margin-bottom:20px;}
  .breakdown{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;margin:20px 0 26px;
  }
  .bd{
    background:#f8fafc;border:2px solid var(--line);
    border-radius:15px;padding:14px;

  .bd h4{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
  .bd p{font-size:1.15rem;font-weight:800;color:#1e1b4b;}
  .btn{
    padding:13px 26px;border-radius:13px;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:.95rem;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
    box-shadow:0 8px 20px rgba(79,70,229,.4);

  /* ---------- REVIEW DRAWER ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.55);
    backdrop-filter:blur(3px);opacity:0;pointer-events:none;
    transition:.28s;z-index:80;
  }
  .backdrop.show{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;
    background:#f8fafc;z-index:90;
    transform:translateX(105%);

  .drawer-head{

    font-size:1.1rem;font-weight:700;transition:.16s;

  .drawer-body{flex:1;overflow-y:auto;padding:14px;}
  .rev-item{
    background:#fff;border-radius:14px;padding:13px 14px;
    margin-bottom:10px;border-left:5px solid var(--line);
    box-shadow:0 2px 8px rgba(15,23,42,.06);

  }

  .rev-item.bad{border-left-color:#ef4444;}
  .rev-item .rq{font-size:.86rem;font-weight:700;color:#1e293b;margin-bottom:7px;}
  .rev-item .rq em{color:#6366f1;font-style:normal;font-weight:800;}
  .rev-item .ra{font-size:.79rem;line-height:1.55;color:#475569;}
  .rev-item .ra b{font-weight:800;}
  .tag{
    display:inline-block;font-size:.68rem;font-weight:800;
    padding:2px 8px;border-radius:999px;margin-bottom:6px;
    letter-spacing:.4px;
  }
  .tag.good{background:var(--green-l);color:#15803d;}
  .tag.bad{background:var(--red-l);color:#b91c1c;}
  .tag.skip{background:#f1f5f9;color:#64748b;}
  .empty{text-align:center;color:var(--muted);font-size:.86rem;padding:40px 20px;font-weight:600;}

    .brand h1{font-size:1rem;}
    .brand p{font-size:.68rem;}
    .chip{padding:6px 10px;font-size:.72rem;}
    .qtext{font-size:1.1rem;}
    .option{font-size:.92rem;padding:12px 13px;}
    .wrap{margin-top:18px;}
  }
</style>
</head>

  {sec:"C", q:"How did he open the box?", o:[
    "How did the box open by him?",
    "How was the box opened by him?",
    "How was the box open by him?",
    "By how was the box opened?"], a:1},

  {sec:"C", q:"How quickly did she finish the assignment?", o:[
    "How quickly did the assignment finish by her?",
    "How quickly was the assignment finished by her?",
    "How quickly was the assignment finish by her?",
    "By how quickly was the assignment finished?"], a:1}
];

/* ============================================================
   STATE
   ============================================================ */
const LETTERS = ["A","B","C","D"];
const AUTO_DELAY = 1500;         // 1.5 seconds auto-advance

let current   = 0;
let locked    = false;
let responses = [];              // {chosen:Number|null, correct:Boolean}
let timerId   = null;
let finished  = false;

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const stageEl    = $("stage");
const qTextEl    = $("qText");
const optionsEl  = $("options");
const feedbackEl = $("feedback");
const timerbarEl = $("timerbar");
const counterEl  = $("qCounter");
const badgeEl    = $("secBadge");
const progressEl = $("progressFill");
const statCorrect= $("statCorrect");
const statWrong  = $("statWrong");
const statScore  = $("statScore");
const reviewBtn  = $("reviewBtn");
const drawer     = $("drawer");
const backdrop   = $("backdrop");
const drawerBody = $("drawerBody");
const revSub     = $("revSub");

/* ============================================================
   RENDER QUESTION
   ============================================================ */
function renderQuestion(){
  locked = false;
  finished = false;
  const item = questions[current];

  counterEl.textContent = `Question ${current+1} of ${questions.length}`;
  badgeEl.textContent   = SECTION_NAMES[item.sec];
  qTextEl.innerHTML     = `<span class="qnum">Q${current+1}.</span> ${item.q}`;

  feedbackEl.className = "feedback";
  feedbackEl.textContent = "";
  timerbarEl.style.transition = "none";
  timerbarEl.style.width = "0%";

  optionsEl.innerHTML = "";
  item.o.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.type = "button";
    btn.innerHTML = `<span class="key">${LETTERS[i]}</span><span class="text">${text}</span>`;
    btn.addEventListener("click", () => choose(i, btn));
    optionsEl.appendChild(btn);
  });

  // re-trigger card animation
  const card = $("card");
  if(card){
    card.style.animation = "none";
    void card.offsetWidth;
    card.style.animation = "pop .32s cubic-bezier(.2,.9,.3,1.3)";
  }

  updateStats();
}

/* ============================================================
   HANDLE CHOICE
   ============================================================ */
function choose(index, btnEl){
  if(locked || finished) return;
  locked = true;

  const item    = questions[current];
  const isRight = index === item.a;
  const nodes   = Array.from(optionsEl.children);

  nodes.forEach((el, idx) => {
    el.classList.add("disabled");
    if(idx === item.a)      el.classList.add("correct");
    else if(idx === index)  el.classList.add("wrong");
  });

  responses[current] = { chosen: index, correct: isRight };

  /* feedback text */
  if(isRight){
    feedbackEl.className = "feedback show good";
    feedbackEl.innerHTML = `✓ Correct! <span style="font-weight:600;color:#475569">“${item.o[item.a]}”</span>`;
  }else{
    feedbackEl.className = "feedback show bad";
    feedbackEl.innerHTML = `✕ Incorrect — correct answer: <b>${LETTERS[item.a]}.</b> ${item.o[item.a]}`;
  }

  updateStats();
  if(drawer.classList.contains("open")) renderReview();

  /* countdown bar */
  timerbarEl.style.transition = "none";
  timerbarEl.style.width = "100%";
  void timerbarEl.offsetWidth;
  timerbarEl.style.transition = `width ${AUTO_DELAY}ms linear`;
  timerbarEl.style.width = "0%";

  clearTimeout(timerId);
  timerId = setTimeout(nextQuestion, AUTO_DELAY);
}

/* ============================================================
   NEXT / FINISH
   ============================================================ */
function nextQuestion(){
  clearTimeout(timerId);
  current++;
  if(current >= questions.length){
    showResults();
    return;
  }
  renderQuestion();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ============================================================
   STATS
   ============================================================ */
function updateStats(){
  const answered = responses.filter(Boolean).length;
  const correct  = responses.filter(r => r && r.correct).length;
  const wrong    = answered - correct;
  const pct      = answered ? Math.round((correct / answered) * 100) : 0;

  statCorrect.textContent = correct;
  statWrong.textContent   = wrong;
  statScore.textContent   = pct + "%";
  progressEl.style.width  = (answered / questions.length) * 100 + "%";
}

/* ============================================================
   RESULTS
   ============================================================ */
function showResults(){
  finished = true;
  clearTimeout(timerId);

  const total    = questions.length;
  const answered = responses.filter(Boolean).length;
  const correct  = responses.filter(r => r && r.correct).length;
  const wrong    = answered - correct;
  const skipped  = total - answered;
  const pct      = Math.round((correct / total) * 100);

  let grade, emoji;
  if(pct >= 90)      { grade = "Excellent! Outstanding command of the passive voice."; emoji = "🏆"; }
  else if(pct >= 75) { grade = "Very Good! Just a little polishing needed.";           emoji = "⭐"; }
  else if(pct >= 60) { grade = "Good. Revise the Wh-word patterns once more.";         emoji = "👍"; }
  else if(pct >= 40) { grade = "Keep practising — focus on 'by whom' + be + V3.";      emoji = "📖"; }
  else               { grade = "Needs revision. Re-read the conversion steps.";        emoji = "🔁"; }

  /* section breakdown */
  const secStats = {};
  questions.forEach((item, i) => {
    if(!secStats[item.sec]) secStats[item.sec] = {c:0, t:0};
    secStats[item.sec].t++;
    if(responses[i] && responses[i].correct) secStats[item.sec].c++;
  });
  const secTitles = {A:"A · Wh-word as Subject", B:"B · Wh-word as Object", C:"C · Wh-word Neither"};

  const breakdownHTML = Object.keys(secStats).map(k => `
    <div class="bd">
      <h4>${secTitles[k]}</h4>
      <p>${secStats[k].c} / ${secStats[k].t}</p>
    </div>`).join("");

  stageEl.innerHTML = `
    <div class="card result">
      <div class="ring" style="--pct:${pct}%">
        <span>${pct}%</span>
      </div>
      <h2>${emoji} Quiz Complete!</h2>
      <p class="grade">${grade}</p>

      <div class="breakdown">
        <div class="bd"><h4>Total Questions</h4><p>${total}</p></div>
        <div class="bd"><h4>Correct</h4><p style="color:#16a34a">${correct}</p></div>
        <div class="bd"><h4>Wrong</h4><p style="color:#dc2626">${wrong}</p></div>
        <div class="bd"><h4>Not Attempted</h4><p style="color:#64748b">${skipped}</p></div>
      </div>

      <div class="breakdown">${breakdownHTML}</div>

      <button class="btn" id="restartBtn">🔄 Try Again</button>
      <button class="btn" id="openReviewBtn" style="background:linear-gradient(135deg,#0f172a,#334155);margin-left:8px;">📋 Review All</button>
    </div>`;

  progressEl.style.width = "100%";
  counterEl.textContent  = "Completed";
  badgeEl.textContent    = "All 50 questions attempted";

  $("restartBtn").addEventListener("click", restart);
  $("openReviewBtn").addEventListener("click", () => { openDrawer(); });
  renderReview();
  updateStats();
}

/* ============================================================
   RESTART
   ============================================================ */
function restart(){
  current = 0;
  locked = false;
  finished = false;
  responses = [];
  clearTimeout(timerId);

  stageEl.innerHTML = `
    <div class="card" id="card">
      <h2 class="qtext" id="qText"></h2>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="timerbar" id="timerbar"></div>
    </div>`;

  // re-bind DOM refs
  window.qTextEl    = document.getElementById("qText");
  window.optionsEl  = document.getElementById("options");
  window.feedbackEl = document.getElementById("feedback");
  window.timerbarEl = document.getElementById("timerbar");

  bindRefs();
  renderQuestion();
  updateStats();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* re-bind after DOM replacement */
let qTextEl2, optionsEl2, feedbackEl2, timerbarEl2;
function bindRefs(){
  qTextEl2    = document.getElementById("qText");
  optionsEl2  = document.getElementById("options");
  feedbackEl2 = document.getElementById("feedback");
  timerbarEl2 = document.getElementById("timerbar");
}

/* ============================================================
   REVIEW DRAWER
   ============================================================ */
function openDrawer(){
  renderReview();
  drawer.classList.add("open");
  backdrop.classList.add("show");
  reviewBtn.classList.add("active");
}
function closeDrawer(){
  drawer.classList.remove("open");
  backdrop.classList.remove("show");
  reviewBtn.classList.remove("active");
}
function toggleDrawer(){
  drawer.classList.contains("open") ? closeDrawer() : openDrawer();
}

function renderReview(){
  const answered = responses.filter(Boolean).length;
  revSub.textContent = answered
    ? `${answered} of ${questions.length} answered`
    : "No answers yet";

  if(answered === 0){
    drawerBody.innerHTML = `<div class="empty">You haven't answered any question yet.<br>Start the quiz to build your review list.</div>`;
    return;
  }

  let html = "";
  questions.forEach((item, i) => {
    const r = responses[i];
    if(!r) return;

    const cls  = r.correct ? "good" : "bad";
    const tag  = r.correct
      ? `<span class="tag good">✓ CORRECT</span>`
      : `<span class="tag bad">✕ WRONG</span>`;

    const yourAns = `${LETTERS[r.chosen]}. ${item.o[r.chosen]}`;
    const rightAns = `${LETTERS[item.a]}. ${item.o[item.a]}`;

    html += `
      <div class="rev-item ${cls}">
        ${tag}
        <div class="rq"><em>Q${i+1}.</em> ${item.q}</div>
        <div class="ra">
          <b>Your answer:</b> ${yourAns}<br>
          ${r.correct ? "" : `<b>Correct answer:</b> ${rightAns}`}
        </div>
      </div>`;
  });

  drawerBody.innerHTML = html;
}

/* ============================================================
   EVENTS
   ============================================================ */
reviewBtn.addEventListener("click", toggleDrawer);
$("closeDrawer").addEventListener("click", closeDrawer);
backdrop.addEventListener("click", closeDrawer);

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeDrawer();

  if(finished || locked) return;

  // 1-4 or A-D to answer
  const k = e.key.toUpperCase();
  const byNum  = ["1","2","3","4"].indexOf(k);
  const byLett = ["A","B","C","D"].indexOf(k);
  const idx = byNum > -1 ? byNum : byLett;

  if(idx > -1 && idx < optionsEl2.children.length){
    optionsEl2.children[idx].click();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
bindRefs();
renderQuestion();
updateStats();
</script>
</body>
</html>
