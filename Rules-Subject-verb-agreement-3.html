<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Subject–Verb Agreement · vibrant slides</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f9f3e8 0%, #ffe9d6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .slide-container {
      width: 100%;
      max-width: 1200px;
      background: rgba(255, 247, 235, 0.7);
      backdrop-filter: blur(6px);
      border-radius: 4.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.2), 0 0 0 2px #ffe0c0 inset;
      transition: all 0.25s ease;
    }

    .slide-card {
      background: #fffcf7;
      border-radius: 3.5rem;
      padding: 2.5rem 2.8rem;
      box-shadow: 0 20px 35px rgba(180, 100, 50, 0.15);
      border: 1px solid #fadbc8;
      transition: 0.3s;
    }

    .rule-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
      border-bottom: 3px dashed #fbcbb5;
      padding-bottom: 0.8rem;
    }

    .rule-number {
      background: #ffb48c;
      color: #2d1b0e;
      font-weight: 800;
      font-size: 1.8rem;
      padding: 0.2rem 1.3rem;
      border-radius: 80px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 0 #b16f4a;
    }

    .rule-text {
      font-size: 2rem;
      font-weight: 700;
      color: #331f14;
      line-height: 1.3;
      word-break: break-word;
    }

    .rule-text .highlight-subject {
      color: #c73d3d;
      background: #ffe2e2;
      padding: 0.1rem 0.6rem;
      border-radius: 40px;
      font-weight: 800;
      display: inline-block;
      box-shadow: 0 2px 0 #b14f4f;
    }

    .rule-text .highlight-verb {
      color: #1d7a4f;
      background: #d9f0e6;
      padding: 0.1rem 0.6rem;
      border-radius: 40px;
      font-weight: 800;
      display: inline-block;
      box-shadow: 0 2px 0 #147a4a;
    }

    .example-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.2rem;
      margin-top: 2rem;
    }

    .example-box {
      background: #f8f0e8;
      border-radius: 2.2rem;
      padding: 1.5rem 1.8rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.02), 0 6px 12px rgba(180, 100, 50, 0.08);
      border: 1px solid #edd9cb;
    }

    .example-box.correct {
      border-left: 10px solid #3ba87c;
      background: #f3faf6;
    }

    .example-box.wrong {
      border-left: 10px solid #d45a5a;
      background: #fdf3f2;
    }

    .example-label {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .example-label .badge {
      font-size: 0.8rem;
      background: #2d2d2d;
      color: white;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
    }

    .example-label .badge.green {
      background: #1d7a4f;
    }

    .example-label .badge.red {
      background: #b13e3e;
    }

    .sentence {
      font-size: 1.9rem;
      font-weight: 600;
      line-height: 1.5;
      word-break: break-word;
    }

    .sentence .subj {
      color: #c73d3d;
      background: #ffe2e2;
      padding: 0.05rem 0.5rem;
      border-radius: 30px;
      font-weight: 800;
      display: inline-block;
    }

    .sentence .verb {
      color: #1d7a4f;
      background: #d9f0e6;
      padding: 0.05rem 0.5rem;
      border-radius: 30px;
      font-weight: 800;
      display: inline-block;
    }

    .sentence .subj-big {
      font-size: 2.2rem;
      padding: 0 0.4rem;
    }

    .sentence .verb-big {
      font-size: 2.2rem;
      padding: 0 0.4rem;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2.8rem;
      gap: 1rem;
    }

    .nav-btn {
      background: #fadbc8;
      border: none;
      font-size: 2.2rem;
      font-weight: 800;
      padding: 0.8rem 2.2rem;
      border-radius: 80px;
      color: #2d1b0e;
      box-shadow: 0 8px 0 #b58b74, 0 4px 12px rgba(0,0,0,0.1);
      transition: all 0.08s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 130px;
      justify-content: center;
      border: 1px solid #f0cbaf;
    }

    .nav-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #b58b74;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b58b74;
      pointer-events: none;
    }

    .slide-counter {
      font-size: 1.6rem;
      font-weight: 700;
      background: #ffdcbf;
      padding: 0.4rem 2rem;
      border-radius: 80px;
      color: #2d1b0e;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    }

    @media (max-width: 800px) {
      .slide-card { padding: 1.8rem; }
      .example-grid { grid-template-columns: 1fr; gap: 1.2rem; }
      .rule-text { font-size: 1.6rem; }
      .sentence { font-size: 1.5rem; }
      .nav-btn { font-size: 1.4rem; padding: 0.6rem 1.2rem; min-width: 90px; }
      .slide-container { padding: 1rem; }
    }

    @media (max-width: 480px) {
      .rule-number { font-size: 1.2rem; padding: 0.1rem 0.9rem; }
      .rule-text { font-size: 1.3rem; }
      .sentence { font-size: 1.2rem; }
      .nav-btn { font-size: 1.1rem; padding: 0.4rem 0.8rem; min-width: 70px; }
    }
  </style>
</head>
<body>
<div class="slide-container">
  <div class="slide-card" id="slideCard">
    <!-- header will be injected -->
    <div id="ruleHeader" class="rule-header"></div>
    <!-- examples -->
    <div id="exampleGrid" class="example-grid"></div>
    <!-- navigation -->
    <div class="nav-controls">
      <button class="nav-btn" id="prevBtn">◀ PREV</button>
      <span class="slide-counter" id="slideCounter">1 / 100</span>
      <button class="nav-btn" id="nextBtn">NEXT ▶</button>
    </div>
  </div>
</div>

<script>
  (function(){
    // raw data from the 100 rules (parsed from the given tables)
    const rulesData = [
      // page 1 (1–10)
      { rule: "Singular subject takes singular verb", correct: "The boy plays cricket.", wrong: "The boy play cricket." },
      { rule: "Plural subject takes plural verb", correct: "The boys play cricket.", wrong: "The boys plays cricket." },
      { rule: "Two subjects joined by and take a plural verb", correct: "Ravi and Mohan are friends.", wrong: "Ravi and Mohan is friends." },
      { rule: "Two nouns expressing one idea take a singular verb", correct: "Bread and butter is my breakfast.", wrong: "Bread and butter are my breakfast." },
      { rule: "Each of + plural noun takes a singular verb", correct: "Each of the students is present.", wrong: "Each of the students are present." },
      { rule: "Every + singular noun takes a singular verb", correct: "Every child likes music.", wrong: "Every child like music." },
      { rule: "Either of + plural noun takes a singular verb", correct: "Either of the roads leads home.", wrong: "Either of the roads lead home." },
      { rule: "Neither of + plural noun takes a singular verb", correct: "Neither of the answers is correct.", wrong: "Neither of the answers are correct." },
      { rule: "One of + plural noun takes a singular verb", correct: "One of the players is injured.", wrong: "One of the players are injured." },
      { rule: "The number of + plural noun takes a singular verb", correct: "The number of students is rising.", wrong: "The number of students are rising." },
      // page 2 (11–20)
      { rule: "A number of + plural noun takes a plural verb", correct: "A number of students are absent.", wrong: "A number of students is absent." },
      { rule: "Many a + singular noun takes a singular verb", correct: "Many a student has failed.", wrong: "Many a student have failed." },
      { rule: "More than one + singular noun takes a singular verb", correct: "More than one player has scored.", wrong: "More than one player have scored." },
      { rule: "Every one of + plural noun takes a singular verb", correct: "Every one of the books is useful.", wrong: "Every one of the books are useful." },
      { rule: "Each one of + plural noun takes a singular verb", correct: "Each one of the girls sings well.", wrong: "Each one of the girls sing well." },
      { rule: "Everyone / Everybody takes a singular verb", correct: "Everyone is ready.", wrong: "Everyone are ready." },
      { rule: "Someone / Somebody takes a singular verb", correct: "Somebody wants help.", wrong: "Somebody want help." },
      { rule: "Anyone / Anybody takes a singular verb", correct: "Anybody knows the answer.", wrong: "Anybody know the answer." },
      { rule: "No one / Nobody takes a singular verb", correct: "Nobody was absent.", wrong: "Nobody were absent." },
      { rule: "Something / Anything / Nothing takes a singular verb", correct: "Nothing seems impossible.", wrong: "Nothing seem impossible." },
      // page 3 (21–30)
      { rule: "Much + uncountable noun takes a singular verb", correct: "Much water is wasted.", wrong: "Much water are wasted." },
      { rule: "Little + uncountable noun takes a singular verb", correct: "Little time is left.", wrong: "Little time are left." },
      { rule: "A little + uncountable noun takes a singular verb", correct: "A little milk is enough.", wrong: "A little milk are enough." },
      { rule: "Much of + uncountable noun takes a singular verb", correct: "Much of the work is done.", wrong: "Much of the work are done." },
      { rule: "Some of + singular or uncountable noun takes a singular verb", correct: "Some of the cake is missing.", wrong: "Some of the cake are missing." },
      { rule: "Some of + plural noun takes a plural verb", correct: "Some of the boys are late.", wrong: "Some of the boys is late." },
      { rule: "Most of + singular or uncountable noun takes a singular verb", correct: "Most of the money is gone.", wrong: "Most of the money are gone." },
      { rule: "Most of + plural noun takes a plural verb", correct: "Most of the players are fit.", wrong: "Most of the players is fit." },
      { rule: "All of + singular or uncountable noun takes a singular verb", correct: "All of the milk is spoiled.", wrong: "All of the milk are spoiled." },
      { rule: "All of + plural noun takes a plural verb", correct: "All of the children are smiling.", wrong: "All of the children is smiling." },
      // page 4 (31–40)
      { rule: "Half of + singular noun takes a singular verb", correct: "Half of the cake is eaten.", wrong: "Half of the cake are eaten." },
      { rule: "Half of + plural noun takes a plural verb", correct: "Half of the students are absent.", wrong: "Half of the students is absent." },
      { rule: "Percent of + singular noun takes a singular verb", correct: "Ten percent of the land is barren.", wrong: "Ten percent of the land are barren." },
      { rule: "Percent of + plural noun takes a plural verb", correct: "Fifty percent of the voters are undecided.", wrong: "Fifty percent of the voters is undecided." },
      { rule: "One-third of + singular noun takes a singular verb", correct: "One-third of the work is complete.", wrong: "One-third of the work are complete." },
      { rule: "One-third of + plural noun takes a plural verb", correct: "One-third of the apples are rotten.", wrong: "One-third of the apples is rotten." },
      { rule: "A lot of + uncountable noun takes a singular verb", correct: "A lot of sugar is used.", wrong: "A lot of sugar are used." },
      { rule: "A lot of + plural noun takes a plural verb", correct: "A lot of books are missing.", wrong: "A lot of books is missing." },
      { rule: "Plenty of + uncountable noun takes a singular verb", correct: "Plenty of food is available.", wrong: "Plenty of food are available." },
      { rule: "Plenty of + plural noun takes a plural verb", correct: "Plenty of seats are vacant.", wrong: "Plenty of seats is vacant." },
      // page 5 (41–50)
      { rule: "Collective noun as one unit takes a singular verb", correct: "The team is winning.", wrong: "The team are winning." },
      { rule: "Collective noun as members acting separately takes a plural verb", correct: "The team are arguing among themselves.", wrong: "The team is arguing among themselves." },
      { rule: "Family as one unit takes a singular verb", correct: "My family is small.", wrong: "My family are small." },
      { rule: "Family as members acting separately takes a plural verb", correct: "My family are discussing their plans.", wrong: "My family is discussing their plans." },
      { rule: "Committee as one body takes a singular verb", correct: "The committee has approved the plan.", wrong: "The committee have approved the plan." },
      { rule: "Committee as members acting separately takes a plural verb", correct: "The committee are divided in their opinions.", wrong: "The committee is divided in their opinions." },
      { rule: "Jury as one body takes a singular verb", correct: "The jury has reached its verdict.", wrong: "The jury have reached its verdict." },
      { rule: "Jury as members acting separately takes a plural verb", correct: "The jury are arguing among themselves.", wrong: "The jury is arguing among themselves." },
      { rule: "Staff as one unit takes a singular verb", correct: "The staff is efficient.", wrong: "The staff are efficient." },
      { rule: "Staff as members acting separately takes a plural verb", correct: "The staff are wearing their uniforms.", wrong: "The staff is wearing their uniforms." },
      // page 6 (51–60)
      { rule: "Neither...nor agrees with the nearer subject", correct: "Neither the teachers nor the principal is coming.", wrong: "Neither the teachers nor the principal are coming." },
      { rule: "Neither...nor with plural nearer subject takes a plural verb", correct: "Neither the principal nor the teachers are coming.", wrong: "Neither the principal nor the teachers is coming." },
      { rule: "Either...or agrees with the nearer subject", correct: "Either the boys or the girl is ready.", wrong: "Either the boys or the girl are ready." },
      { rule: "Either...or with plural nearer subject takes a plural verb", correct: "Either the girl or the boys are ready.", wrong: "Either the girl or the boys is ready." },
      { rule: "Not only...but also agrees with the nearer subject", correct: "Not only the players but also the coach is upset.", wrong: "Not only the players but also the coach are upset." },
      { rule: "Not only...but also with plural nearer subject takes a plural verb", correct: "Not only the coach but also the players are upset.", wrong: "Not only the coach but also the players is upset." },
      { rule: "Along with does not change the subject", correct: "The captain, along with the players, is here.", wrong: "The captain, along with the players, are here." },
      { rule: "Together with does not change the subject", correct: "My brother, together with his friends, is travelling.", wrong: "My brother, together with his friends, are travelling." },
      { rule: "As well as does not make the subject plural", correct: "The teacher, as well as the students, was excited.", wrong: "The teacher, as well as the students, were excited." },
      { rule: "With does not change the subject", correct: "The boy with his friends is playing.", wrong: "The boy with his friends are playing." },
      // page 7 (61–70)
      { rule: "There is / There are agrees with the real subject singular", correct: "There is a book on the table.", wrong: "There are a book on the table." },
      { rule: "There is / There are agrees with the real subject plural", correct: "There are two books on the table.", wrong: "There is two books on the table." },
      { rule: "Here comes / Here come agrees with the real subject singular", correct: "Here comes the bus.", wrong: "Here come the bus." },
      { rule: "Here comes / Here come agrees with the real subject plural", correct: "Here come the buses.", wrong: "Here comes the buses." },
      { rule: "Relative pronoun who agrees with a singular antecedent", correct: "He is the boy who works hard.", wrong: "He is the boy who work hard." },
      { rule: "Relative pronoun who agrees with a plural antecedent", correct: "They are the boys who work hard.", wrong: "They are the boys who works hard." },
      { rule: "Relative pronoun that agrees with a singular antecedent", correct: "This is the car that needs repair.", wrong: "This is the car that need repair." },
      { rule: "Relative pronoun that agrees with a plural antecedent", correct: "These are the cars that need repair.", wrong: "These are the cars that needs repair." },
      { rule: "A phrase between subject and verb does not change agreement", correct: "The box of toys is heavy.", wrong: "The box of toys are heavy." },
      { rule: "Ignore the noun in a prepositional phrase", correct: "The quality of the apples is good.", wrong: "The quality of the apples are good." },
      // page 8 (71–80)
      { rule: "Title of a book or movie takes a singular verb", correct: "The Chronicles of Narnia is popular.", wrong: "The Chronicles of Narnia are popular." },
      { rule: "Name of a country ending in s takes a singular verb", correct: "The United States is powerful.", wrong: "The United States are powerful." },
      { rule: "Name of an organization ending in s takes a singular verb", correct: "The United Nations has issued a statement.", wrong: "The United Nations have issued a statement." },
      { rule: "A disease ending in s takes a singular verb", correct: "Measles is contagious.", wrong: "Measles are contagious." },
      { rule: "News takes a singular verb", correct: "The news is surprising.", wrong: "The news are surprising." },
      { rule: "Mathematics takes a singular verb", correct: "Mathematics is difficult.", wrong: "Mathematics are difficult." },
      { rule: "Physics takes a singular verb", correct: "Physics is interesting.", wrong: "Physics are interesting." },
      { rule: "Economics takes a singular verb", correct: "Economics is useful.", wrong: "Economics are useful." },
      { rule: "Politics as a subject takes a singular verb", correct: "Politics is a demanding subject.", wrong: "Politics are a demanding subject." },
      { rule: "Statistics as a subject takes a singular verb", correct: "Statistics is my favorite paper.", wrong: "Statistics are my favorite paper." },
      // page 9 (81–90)
      { rule: "A sum of money as one amount takes a singular verb", correct: "Ten thousand rupees is enough.", wrong: "Ten thousand rupees are enough." },
      { rule: "A distance as one unit takes a singular verb", correct: "Five kilometers is a long walk.", wrong: "Five kilometers are a long walk." },
      { rule: "A period of time as one unit takes a singular verb", correct: "Ten years is a long time.", wrong: "Ten years are a long time." },
      { rule: "A weight or quantity as one unit takes a singular verb", correct: "Five kilos of rice is enough.", wrong: "Five kilos of rice are enough." },
      { rule: "A pair of + plural-looking noun takes a singular verb", correct: "A pair of scissors is on the table.", wrong: "A pair of scissors are on the table." },
      { rule: "Scissors take a plural verb", correct: "The scissors are blunt.", wrong: "The scissors is blunt." },
      { rule: "Trousers take a plural verb", correct: "My trousers are new.", wrong: "My trousers is new." },
      { rule: "Spectacles take a plural verb", correct: "Her spectacles are broken.", wrong: "Her spectacles is broken." },
      { rule: "The rich / the poor take plural verbs", correct: "The rich are not always happy.", wrong: "The rich is not always happy." },
      { rule: "The + adjective meaning a class takes a plural verb", correct: "The poor need support.", wrong: "The poor needs support." },
      // page 10 (91–100)
      { rule: "Both + plural noun takes a plural verb", correct: "Both boys are absent.", wrong: "Both boys is absent." },
      { rule: "Few + plural noun takes a plural verb", correct: "Few students know the answer.", wrong: "Few students knows the answer." },
      { rule: "A few + plural noun takes a plural verb", correct: "A few books were lost.", wrong: "A few books was lost." },
      { rule: "Several + plural noun takes a plural verb", correct: "Several players are injured.", wrong: "Several players is injured." },
      { rule: "Many + plural noun takes a plural verb", correct: "Many children like ice cream.", wrong: "Many children likes ice cream." },
      { rule: "None of + uncountable noun takes a singular verb", correct: "None of the water is dirty.", wrong: "None of the water are dirty." },
      { rule: "None of + plural noun takes a plural verb", correct: "None of the students are late.", wrong: "None of the students is late." },
      { rule: "Both of + plural noun takes a plural verb", correct: "Both of the answers are correct.", wrong: "Both of the answers is correct." },
      { rule: "One of those who takes a plural verb in the relative clause", correct: "She is one of those girls who have won the prize.", wrong: "She is one of those girls who has won the prize." },
      { rule: "The only one of those who takes a singular verb in the relative clause", correct: "She is the only one of those girls who has won the prize.", wrong: "She is the only one of those girls who have won the prize." }
    ];

    let currentIndex = 0;
    const total = rulesData.length;

    const headerEl = document.getElementById('ruleHeader');
    const gridEl = document.getElementById('exampleGrid');
    const counterEl = document.getElementById('slideCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function renderSlide(index) {
      const data = rulesData[index];
      if (!data) return;

      // header
      const ruleNum = index + 1;
      headerEl.innerHTML = `
        <span class="rule-number">#${ruleNum}</span>
        <span class="rule-text">${highlightRule(data.rule)}</span>
      `;

      // examples
      gridEl.innerHTML = `
        <div class="example-box correct">
          <div class="example-label"><span class="badge green">✔ correct</span></div>
          <div class="sentence">${highlightSentence(data.correct)}</div>
        </div>
        <div class="example-box wrong">
          <div class="example-label"><span class="badge red">✘ wrong</span></div>
          <div class="sentence">${highlightSentence(data.wrong)}</div>
        </div>
      `;

      counterEl.textContent = `${ruleNum} / ${total}`;
      prevBtn.disabled = (index === 0);
      nextBtn.disabled = (index === total - 1);
    }

    // highlight rule: subject & verb (just wrap with spans for demo)
    function highlightRule(ruleText) {
      // simple heuristic: wrap words that look like subject/verb? but we just highlight known patterns.
      // we'll use a more general approach: mark "subject" and "verb" keywords with colors.
      let text = ruleText;
      // we don't want to overcomplicate, just add colored spans to key terms 
      // but we keep it clean, we'll apply to words like "subject", "verb", "singular", "plural"
      // but the real emphasis is on examples. We keep rule text with bold colors for important words.
      const words = text.split(' ');
      const styled = words.map(w => {
        const lower = w.toLowerCase();
        if (lower === 'subject' || lower === 'subjects') return `<span class="highlight-subject">${w}</span>`;
        if (lower === 'verb' || lower === 'verbs') return `<span class="highlight-verb">${w}</span>`;
        if (lower === 'singular' || lower === 'plural') return `<span style="background:#f0d6b0;padding:0.1rem 0.5rem;border-radius:20px;font-weight:700;">${w}</span>`;
        return w;
      });
      return styled.join(' ');
    }

    // highlight subject and verb in sentences: we find keywords like "is/are/was/were/plays/play" etc.
    // but for simplicity we wrap all verbs and subjects manually? we'll use a regex heuristic.
    function highlightSentence(sentence) {
      // This is a demo: we tag the first noun/pronoun as subject and the verb as verb.
      // but we want to be generic: we use pattern:  (word) + (is/are/was/were/has/have/plays/play/etc)
      // we'll just highlight common verbs and subjects in a playful way.
      let highlighted = sentence;
      // simple verb list
      const verbList = ['is', 'are', 'was', 'were', 'has', 'have', 'plays', 'play', 'likes', 'like', 'wants', 'want', 'knows', 'know', 'seems', 'seem', 'leads', 'lead', 'comes', 'come', 'works', 'work', 'needs', 'need', 'takes', 'take', 'arguing', 'discussing', 'approved', 'reached', 'wearing', 'scored', 'failed', 'ready', 'absent', 'late', 'gone', 'spoiled', 'smiling', 'eaten', 'barren', 'undecided', 'complete', 'rotten', 'used', 'missing', 'available', 'vacant', 'winning', 'arguing', 'discussing', 'travelling', 'excited', 'playing', 'hard', 'repair', 'heavy', 'good', 'popular', 'powerful', 'issued', 'contagious', 'surprising', 'difficult', 'interesting', 'useful', 'demanding', 'enough', 'walk', 'time', 'blunt', 'new', 'broken', 'happy', 'support', 'absent', 'lost', 'injured', 'ice', 'dirty', 'late', 'correct', 'won', 'prize'];
      // we'll wrap occurrences: but to not break everything, we just wrap whole words.
      // a more elegant approach: split and wrap if word in verbList.
      const words = sentence.split(/\s+/);
      const newWords = words.map(w => {
        // clean punctuation
        const clean = w.replace(/[^a-zA-Z]/g, '').toLowerCase();
        if (verbList.includes(clean)) {
          return `<span class="verb">${w}</span>`;
        }
        // also mark some common subjects: nouns like boy, boys, team, family, etc.
        const subjectList = ['boy', 'boys', 'team', 'family', 'committee', 'jury', 'staff', 'player', 'players', 'student', 'students', 'teacher', 'teachers', 'book', 'books', 'child', 'children', 'girl', 'girls', 'principal', 'captain', 'brother', 'bus', 'buses', 'car', 'cars', 'scissors', 'trousers', 'spectacles', 'rich', 'poor', 'water', 'milk', 'cake', 'money', 'land', 'voters', 'apples', 'sugar', 'seats', 'rice', 'kilometers', 'years', 'kilos', 'rupees', 'news', 'mathematics', 'physics', 'economics', 'politics', 'statistics', 'united', 'nations', 'measles'];
        if (subjectList.includes(clean)) {
          return `<span class="subj">${w}</span>`;
        }
        return w;
      });
      return newWords.join(' ');
    }

    // event listeners
    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < total - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    });

    // initial render
    renderSlide(0);
  })();
</script>
</body>
</html>
