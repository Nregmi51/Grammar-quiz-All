<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Preposition Quiz · 6 sets · NP Regmi</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b1a2e 0%, #1a2f44 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .quiz-wrapper {
      max-width: 920px;
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 48px;
      padding: 28px 30px 35px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,100,0.06);
      border: 1px solid rgba(255,215,100,0.2);
    }
    /* header with prepared by */
    .header-brand {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 18px;
      gap: 8px 16px;
      border-bottom: 2px solid #f7b73160;
      padding-bottom: 10px;
    }
    .header-brand h1 {
      font-size: 2.0rem;
      font-weight: 700;
      color: #fae1b0;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #f7b73130;
    }
    .header-brand .prepared {
      font-family: 'Courier New', 'Lucida Sans Typewriter', monospace;
      font-weight: 700;
      font-size: 1.4rem;
      color: #d4c9a8;
      background: #1a2f3f;
      padding: 4px 20px;
      border-radius: 40px;
      border-left: 4px solid #f7b731;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .header-brand .prepared i {
      font-style: italic;
      font-weight: 600;
      color: #f7d48a;
    }
    /* fixed score + timer + set selector */
    .stats-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #102433;
      padding: 12px 22px;
      border-radius: 60px;
      margin-bottom: 22px;
      border-left: 4px solid #f7b731;
      border-right: 4px solid #f7b731;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      color: #f5f0e7;
      font-weight: 600;
      flex-wrap: wrap;
      gap: 10px 16px;
    }
    .stats-panel div {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
    }
    .stats-panel .badge {
      background: #2f4b68;
      padding: 4px 16px;
      border-radius: 40px;
      color: #fadc9c;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: inset 0 2px 3px rgba(0,0,0,0.3);
    }
    .stats-panel .timer-box {
      background: #1e3349;
      padding: 4px 22px;
      border-radius: 50px;
      color: #ffd966;
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      border: 1px solid #f7b73160;
    }
    .set-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1d3a4f;
      padding: 2px 14px 2px 18px;
      border-radius: 60px;
      border: 1px solid #f7b73140;
    }
    .set-selector select {
      background: #1f3f58;
      color: #f5e9d0;
      border: none;
      padding: 6px 12px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1.0rem;
      outline: none;
      cursor: pointer;
      border: 1px solid #f7b73160;
    }
    .set-selector select option {
      background: #0f2638;
      color: #f0e2c5;
    }
    .question-area {
      background: #eef3f9;
      border-radius: 32px;
      padding: 28px 28px 18px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.02), 0 12px 28px rgba(0,0,0,0.5);
      margin-bottom: 16px;
      transition: all 0.1s ease;
    }
    .q-text {
      font-size: 1.9rem;
      font-weight: 700;
      color: #0a1d2b;
      margin-bottom: 28px;
      line-height: 1.3;
      border-left: 6px solid #f7b731;
      padding-left: 18px;
      background: linear-gradient(to right, #dce7f3, transparent);
      border-radius: 0 40px 40px 0;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
      gap: 14px 18px;
      margin-top: 8px;
    }
    .option-btn {
      background: white;
      border: none;
      padding: 14px 12px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.2rem;
      color: #0b263a;
      box-shadow: 0 4px 0 #b0c4d4, 0 6px 12px rgba(0,0,0,0.1);
      transition: all 0.08s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 2px solid transparent;
    }
    .option-btn:active { transform: scale(0.96); box-shadow: 0 2px 0 #8fa3b5; }
    .option-btn.correct { background: #2ecc71; border-color: #1e9c54; color: white; box-shadow: 0 4px 0 #1a7640; }
    .option-btn.wrong { background: #e74c3c; border-color: #b03a2e; color: white; box-shadow: 0 4px 0 #8a2c22; }
    .option-btn:disabled { opacity: 0.9; cursor: default; filter: saturate(0.7); }
    .feedback-popup {
      margin: 20px 0 10px;
      padding: 16px 18px;
      border-radius: 50px;
      background: #1f3348;
      color: #f5f2e0;
      font-weight: 600;
      font-size: 1.3rem;
      text-align: center;
      border-left: 8px solid #f7b731;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: 0.15s;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .feedback-popup span { background: #2a4058; padding: 4px 18px; border-radius: 40px; }
    .footer-ctrl {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-progress {
      background: #213b52;
      border: none;
      padding: 10px 28px;
      border-radius: 50px;
      font-weight: 700;
      color: #f0e9d0;
      font-size: 1rem;
      box-shadow: 0 4px 0 #0f202f;
      transition: 0.08s linear;
      cursor: pointer;
      border: 1px solid #f7b73160;
    }
    .btn-progress:active { transform: scale(0.94); }
    .btn-progress:disabled { opacity: 0.5; transform: scale(0.98); cursor: not-allowed; box-shadow: 0 2px 0 #0f202f; }
    .reset-btn { background: #4b2e2e; border-color: #b16f6f; color: #ffddbb; }
    .badge-set { background: #f7b731; color: #0a1d2b; padding: 4px 20px; border-radius: 40px; font-weight: 700; }
    @media (max-width: 680px) {
      .quiz-wrapper { padding: 15px; }
      .q-text { font-size: 1.4rem; }
      .stats-panel { flex-direction: column; align-items: stretch; gap: 6px; }
      .header-brand { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="quiz-wrapper" id="app">
  <!-- header: Prepared By NP Regmi -->
  <div class="header-brand">
    <h1>📘 Preposition Quiz</h1>
    <div class="prepared"><i>✍️ Prepared By</i> <span style="font-weight:800; color:#fad27a;">NP Regmi</span></div>
  </div>

  <!-- fixed scoring + timer + set selector -->
  <div class="stats-panel">
    <div><span class="badge">🎯 SCORE</span> <span id="scoreDisplay" class="badge" style="background:#3a5f7a;">0</span></div>
    <div class="set-selector">
      <span style="color:#d4dce6;">📌 SET</span>
      <select id="setSelector">
        <option value="1">Set 1</option><option value="2">Set 2</option><option value="3">Set 3</option>
        <option value="4">Set 4</option><option value="5">Set 5</option><option value="6">Set 6</option>
      </select>
    </div>
    <div><span class="badge">⏳</span> <span id="timerDisplay" class="timer-box">00:00</span></div>
  </div>

  <!-- question container -->
  <div class="question-area" id="questionArea">
    <div class="q-text" id="questionText">Loading questions...</div>
    <div class="options-grid" id="optionsContainer"></div>
    <div class="feedback-popup" id="feedbackPopup">✨ Click an option to answer</div>
  </div>

  <!-- navigation controls -->
  <div class="footer-ctrl">
    <button class="btn-progress" id="prevBtn" disabled>◀ PREV</button>
    <button class="btn-progress reset-btn" id="resetBtn">⟲ RESET SET</button>
    <button class="btn-progress" id="nextBtn" disabled>NEXT ▶</button>
  </div>
</div>

<script>
  (function() {
    // ---------- 60 questions grouped (6 sets x 10) ----------
    const rawQuestions = [
      // Set 1 (Q1–10)
      { group:1, q:"We are going ........ England.", options:["in","at","to"], correct:2 },
      { group:1, q:"He put the book ........ the table.", options:["from","upon","in","on"], correct:3 },
      { group:1, q:"This fresh air is good ........ you.", options:["for","to","about"], correct:0 },
      { group:1, q:"She carries a bag ........ her hand.", options:["from","in","by"], correct:1 },
      { group:1, q:"I am thinking ........ you all the time.", options:["about","on","in"], correct:0 },
      { group:1, q:"Did you come here ........ train?", options:["in","on","by"], correct:2 },
      { group:1, q:"He is the best boy ........ my class.", options:["at","in","for"], correct:1 },
      { group:1, q:"She was born ........ the year 1970.", options:["on","at","in"], correct:2 },
      { group:1, q:"He suffered ........ cold and hunger.", options:["about","from","over"], correct:1 },
      { group:1, q:"I am ........ trouble now.", options:["at","on","in"], correct:2 },
      // Set 2 (Q11–20)
      { group:2, q:"This man went ........ door to door.", options:["from","before","down"], correct:0 },
      { group:2, q:"What is the advantage ........ doing this?", options:["in","at","of"], correct:2 },
      { group:2, q:"I don't like to travel by car ........ night.", options:["in","at","into"], correct:1 },
      { group:2, q:"We began this work ........ March.", options:["on","from","in"], correct:2 },
      { group:2, q:"The train stops ........ all stations.", options:["at","in","on"], correct:0 },
      { group:2, q:"Translate it from Hindi ........ English.", options:["in","for","into"], correct:2 },
      { group:2, q:"Everyone was listening ........ Hari.", options:["at","to","for"], correct:1 },
      { group:2, q:"What country do you come ........ ?", options:["at","of","from"], correct:2 },
      { group:2, q:"I bought this pen ........ Rs.5.", options:["in","for","from"], correct:1 },
      { group:2, q:"He has been writing ........ 6a.m.", options:["from","since","for"], correct:1 },
      // Set 3 (Q21–30)
      { group:3, q:"Sima is confident ........ her victory.", options:["at","in","of"], correct:2 },
      { group:3, q:"I congratulate you ........ your success.", options:["on","at","for"], correct:0 },
      { group:3, q:"Always depend ........ your own efforts.", options:["in","for","on"], correct:2 },
      { group:3, q:"That man is not fit ........ this job.", options:["at","for","from"], correct:1 },
      { group:3, q:"Don't laugh ........ the poor people.", options:["on","for","at"], correct:2 },
      { group:3, q:"Soma is married ........ Pradeep.", options:["for","with","to"], correct:2 },
      { group:3, q:"She seems to be proud ........ her beauty.", options:["at","of","for"], correct:1 },
      { group:3, q:"You are not qualified ........ this post.", options:["at","from","for"], correct:2 },
      { group:3, q:"This book is useful ........ students.", options:["for","about","at"], correct:0 },
      { group:3, q:"This school is suitable ........ my children.", options:["to","for","about"], correct:1 },
      // Set 4 (Q31–40)
      { group:4, q:"He is satisfied ........ my work.", options:["at","from","with"], correct:2 },
      { group:4, q:"She has no capacity ........ hard work.", options:["to","for","in"], correct:1 },
      { group:4, q:"Please pay attention ........ what he says.", options:["at","in","to"], correct:2 },
      { group:4, q:"The train arrived ........ the platform.", options:["on","into","at"], correct:2 },
      { group:4, q:"You are afraid ........ cats.", options:["to","of","from"], correct:1 },
      { group:4, q:"Who is responsible ........ this mistake?", options:["for","by","at"], correct:0 },
      { group:4, q:"I am not able ........ pay you right now.", options:["by","to","for"], correct:1 },
      { group:4, q:"They deal ........ food-grains.", options:["at","for","in"], correct:2 },
      { group:4, q:"I differ ........ you on that matter.", options:["to","with","about"], correct:1 },
      { group:4, q:"The child did not ask ........ mangoes.", options:["to","at","for"], correct:2 },
      // Set 5 (Q41–50)
      { group:5, q:"That rule does not apply ........ you.", options:["for","at","to"], correct:2 },
      { group:5, q:"Mr. Sen died ........ cancer.", options:["from","of","by"], correct:1 },
      { group:5, q:"The book belongs ........ my brother.", options:["to","at","for"], correct:0 },
      { group:5, q:"This pen differs ........ that in price.", options:["at","in","from"], correct:2 },
      { group:5, q:"Have you any difficulty ........ English?", options:["in","on","for"], correct:0 },
      { group:5, q:"I have no desire ........ a new car now.", options:["at","for","about"], correct:1 },
      { group:5, q:"The soldier died ........ the wounds.", options:["by","of","from"], correct:2 },
      { group:5, q:"He was guilty ........ the murder.", options:["at","of","for"], correct:1 },
      { group:5, q:"This book deals ........ life in Bombay.", options:["in","at","with"], correct:2 },
      { group:5, q:"He filled the glass ........ water.", options:["in","with","for"], correct:1 },
      // Set 6 (Q51–60)
      { group:6, q:"This man has no control ........ his children.", options:["at","on","over"], correct:2 },
      { group:6, q:"Life is full ........ surprises.", options:["at","of","from"], correct:1 },
      { group:6, q:"We are glad ........ help you.", options:["to","for","in"], correct:0 },
      { group:6, q:"Have you ever heard ........ Tagore?", options:["of","on","after"], correct:0 },
      { group:6, q:"She has great affection ........ all her children.", options:["on","to","for"], correct:2 },
      { group:6, q:"They went to Calcutta ........ train.", options:["in","by","on"], correct:1 },
      { group:6, q:"I got angry ........ Moti.", options:["at","from","with"], correct:2 },
      { group:6, q:"Is that question clear ........ you?", options:["for","to","off"], correct:1 },
      { group:6, q:"We all hope ........ a better life.", options:["at","for","on"], correct:1 },
      { group:6, q:"This medicine is good ........ malaria.", options:["at","on","for"], correct:2 }
    ];

    // ---------- state ----------
    let allQuestions = rawQuestions.map((q, idx) => ({ ...q, index: idx }));
    let currentSet = 1;           // 1..6
    let currentIndex = 0;         // index within current set (0-9)
    let score = 0;
    // per-set answer tracking: answered[set][qIndex] = true/false, selected[set][qIndex] = optIndex
    let answered = Array.from({ length: 7 }, () => new Array(10).fill(false));
    let selectedOption = Array.from({ length: 7 }, () => new Array(10).fill(null));
    let timerSeconds = 0;
    let timerInterval = null;
    let isLocked = false;
    let timeoutId = null;

    // DOM elements
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackPopup = document.getElementById('feedbackPopup');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const setSelector = document.getElementById('setSelector');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ---------- helpers ----------
    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }
    function updateTimer() { timerDisplay.textContent = formatTime(timerSeconds); }
    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => { timerSeconds++; updateTimer(); }, 1000);
    }
    function resetTimer() {
      clearInterval(timerInterval); timerInterval = null;
      timerSeconds = 0; updateTimer(); startTimer();
    }

    // get questions for current set
    function getSetQuestions() {
      return allQuestions.filter(q => q.group === currentSet);
    }

    // get current question object
    function getCurrentQ() {
      const setQs = getSetQuestions();
      return setQs[currentIndex] || null;
    }

    // compute score for current set
    function computeSetScore() {
      let s = 0;
      const setQs = getSetQuestions();
      for (let i = 0; i < setQs.length; i++) {
        const q = setQs[i];
        if (answered[currentSet][i] && selectedOption[currentSet][i] === q.correct) s++;
      }
      return s;
    }

    // render current question (within set)
    function renderQuestion() {
      const q = getCurrentQ();
      if (!q) return;
      const setQs = getSetQuestions();
      const globalIndex = q.index; // original index

      questionText.textContent = `${globalIndex+1}. ${q.q}`;
      optionsContainer.innerHTML = '';
      const optLabels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${optLabels[idx]}. ${opt}`;
        btn.dataset.optIndex = idx;
        const isAnswered = answered[currentSet][currentIndex];
        btn.disabled = isAnswered;
        if (isAnswered) {
          const selected = selectedOption[currentSet][currentIndex];
          if (idx === q.correct) btn.classList.add('correct');
          else if (idx === selected && selected !== q.correct) btn.classList.add('wrong');
          btn.style.cursor = 'default';
        }
        btn.addEventListener('click', () => handleOptionClick(idx));
        optionsContainer.appendChild(btn);
      });

      // feedback
      if (answered[currentSet][currentIndex]) {
        const qq = getCurrentQ();
        const selectedIdx = selectedOption[currentSet][currentIndex];
        const isCorrect = (selectedIdx === qq.correct);
        const correctText = qq.options[qq.correct];
        feedbackPopup.innerHTML = isCorrect
          ? `✅ Correct! <span>“${qq.options[selectedIdx]}”</span>`
          : `❌ Wrong! Correct: <span>“${correctText}”</span>`;
      } else {
        feedbackPopup.innerHTML = `✨ Click an option to answer`;
      }

      // update score for current set
      score = computeSetScore();
      scoreDisplay.textContent = score;

      // nav buttons
      prevBtn.disabled = (currentIndex === 0);
      const setQsLen = getSetQuestions().length;
      nextBtn.disabled = (currentIndex === setQsLen - 1);
    }

    // handle option click
    function handleOptionClick(optIdx) {
      if (isLocked) return;
      if (answered[currentSet][currentIndex]) return;

      const q = getCurrentQ();
      if (!q) return;
      const isCorrect = (optIdx === q.correct);
      answered[currentSet][currentIndex] = true;
      selectedOption[currentSet][currentIndex] = optIdx;

      // update UI
      const btns = optionsContainer.querySelectorAll('.option-btn');
      btns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct) btn.classList.add('correct');
        else if (idx === optIdx && !isCorrect) btn.classList.add('wrong');
      });

      const correctAns = q.options[q.correct];
      feedbackPopup.innerHTML = isCorrect
        ? `✅ Correct! <span>“${q.options[optIdx]}”</span>`
        : `❌ Wrong! Correct: <span>“${correctAns}”</span>`;

      // update score
      score = computeSetScore();
      scoreDisplay.textContent = score;

      isLocked = true;
      if (timeoutId) clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        isLocked = false;
        const setQs = getSetQuestions();
        if (currentIndex < setQs.length - 1) {
          currentIndex++;
          renderQuestion();
        } else {
          renderQuestion();
          feedbackPopup.innerHTML = `🏁 Set ${currentSet} complete! Score: ${score}/${setQs.length}`;
        }
        timeoutId = null;
      }, 2000);
    }

    // navigation
    function goToPrev() {
      if (currentIndex > 0) {
        if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
        currentIndex--;
        renderQuestion();
      }
    }
    function goToNext() {
      const setQs = getSetQuestions();
      if (currentIndex < setQs.length - 1) {
        if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
        currentIndex++;
        renderQuestion();
      }
    }

    // reset current set
    function resetSet() {
      if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
      // clear answers for current set
      for (let i = 0; i < 10; i++) {
        answered[currentSet][i] = false;
        selectedOption[currentSet][i] = null;
      }
      currentIndex = 0;
      score = 0;
      scoreDisplay.textContent = '0';
      renderQuestion();
      feedbackPopup.innerHTML = `🔄 Set ${currentSet} reset. Start answering!`;
    }

    // change set
    function changeSet(newSet) {
      if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
      currentSet = newSet;
      currentIndex = 0;
      // reset timer? keep timer running globally
      renderQuestion();
      feedbackPopup.innerHTML = `📌 Set ${currentSet} loaded. Good luck!`;
    }

    // event listeners
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    resetBtn.addEventListener('click', resetSet);

    setSelector.addEventListener('change', function(e) {
      const val = parseInt(e.target.value, 10);
      if (val !== currentSet) {
        changeSet(val);
      }
    });

    // initial load
    resetTimer();
    // set currentSet from selector
    currentSet = parseInt(setSelector.value, 10);
    renderQuestion();
  })();
</script>
</body>
</html>
