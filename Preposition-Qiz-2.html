    }

      if (timerInterval) return;

    // get filtered list based on set and limit
    function getFilteredQuestions() {
      let list = allQuestions;
      if (currentSet !== 'all') {
        list = list.filter(q => q.group === parseInt(currentSet, 10));
      }
      if (questionLimit !== 'all') {
        const limit = parseInt(questionLimit, 10);
        list = list.slice(0, limit);
      }
      return list;
    }

    // get current question object from filtered list
    function getCurrentQ() {
      const list = getFilteredQuestions();
      return list[currentIndex] || null;
    }

    // compute score and percent for current filtered list
    function computeStats() {
      const list = getFilteredQuestions();
      let s = 0;
      let total = list.length;
      for (let i = 0; i < total; i++) {
        const q = list[i];
        if (answered[q.idx] && selectedOption[q.idx] === q.correct) s++;
      }
      return { score: s, total, percent: total > 0 ? Math.round((s/total)*100) : 0 };
    }

    // render
    function renderQuestion() {
      const q = getCurrentQ();
      if (!q) {
        questionText.textContent = 'No questions match filter.';
        optionsContainer.innerHTML = '';
        feedbackPopup.innerHTML = '⚠️ Adjust filters above.';
        prevBtn.disabled = true; nextBtn.disabled = true;
        return;
      }
      const list = getFilteredQuestions();
      const globalIdx = q.idx;

      questionText.textContent = `${globalIdx+1}. ${q.q}`;
      optionsContainer.innerHTML = '';
      const optLabels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${optLabels[idx]}. ${opt}`;
        btn.dataset.optIndex = idx;
        const isAnswered = answered[globalIdx];
        btn.disabled = isAnswered;
        if (isAnswered) {
          const selected = selectedOption[globalIdx];
          if (idx === q.correct) btn.classList.add('correct');
          else if (idx === selected && selected !== q.correct) btn.classList.add('wrong');
          btn.style.cursor = 'default';
        }
        btn.addEventListener('click', () => handleOptionClick(idx));
        optionsContainer.appendChild(btn);
      });

      // feedback
      if (answered[globalIdx]) {
        const qq = getCurrentQ();
        const selectedIdx = selectedOption[globalIdx];
        const isCorrect = (selectedIdx === qq.correct);
        const correctText = qq.options[qq.correct];
        feedbackPopup.innerHTML = isCorrect
          ? `✅ Correct! <span>“${qq.options[selectedIdx]}”</span>`
          : `❌ Wrong! Correct: <span>“${correctText}”</span>`;
      } else {
        feedbackPopup.innerHTML = `✨ Click an option to answer`;
      }

      // update score & percent
      const stats = computeStats();
      score = stats.score;
      scoreDisplay.textContent = score;
      percentDisplay.textContent = stats.percent + '%';

      // nav buttons
      prevBtn.disabled = (currentIndex === 0);
      nextBtn.disabled = (currentIndex === list.length - 1);
    }

    // handle option click
    function handleOptionClick(optIdx) {
      if (isLocked) return;
      const q = getCurrentQ();
      if (!q) return;
      const globalIdx = q.idx;
      if (answered[globalIdx]) return;

      const isCorrect = (optIdx === q.correct);
      answered[globalIdx] = true;
      selectedOption[globalIdx] = optIdx;

      // update UI
      const btns = optionsContainer.querySelectorAll('.option-btn');
      btns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct) btn.classList.add('correct');
        else if (idx === optIdx && !isCorrect) btn.classList.add('wrong');
      });

      const correctAns = q.options[q.correct];
      feedbackPopup.innerHTML = isCorrect
        ? `✅ Correct! <span>“${q.options[optIdx]}”</span>`
        : `❌ Wrong! Correct: <span>“${correctAns}”</span>`;

      // update stats
      const stats = computeStats();
      score = stats.score;
      scoreDisplay.textContent = score;
      percentDisplay.textContent = stats.percent + '%';

      isLocked = true;
      if (timeoutId) clearTimeout(timeoutId);
      timeoutId = setTimeout(() => {
        isLocked = false;
        const list = getFilteredQuestions();
        if (currentIndex < list.length - 1) {
          currentIndex++;
          renderQuestion();
        } else {
          renderQuestion();
          const stats2 = computeStats();
          feedbackPopup.innerHTML = `🏁 Done! Score: ${stats2.score}/${stats2.total} (${stats2.percent}%)`;
        }
        timeoutId = null;
      }, 2000);
    }

    // navigation
    function goToPrev() {
      if (currentIndex > 0) {
        if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
        currentIndex--;
        renderQuestion();
      }
    }
    function goToNext() {
      const list = getFilteredQuestions();
      if (currentIndex < list.length - 1) {
        if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
        currentIndex++;
        renderQuestion();
      }
    }

    // reset everything (filters stay, reset answers & index)
    function resetAll() {
      if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
      initAnswers();
      currentIndex = 0;
      renderQuestion();
      feedbackPopup.innerHTML = `🔄 Reset. Start answering!`;
    }

    // filter change: set or count
    function onFilterChange() {
      if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; isLocked = false; }
      currentIndex = 0;
      renderQuestion();
      feedbackPopup.innerHTML = `📌 Filters updated.`;
    }

    // event listeners
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    resetBtn.addEventListener('click', resetAll);

    setSelector.addEventListener('change', function(e) {
      currentSet = e.target.value;
      onFilterChange();
    });
    countSelector.addEventListener('change', function(e) {
      questionLimit = e.target.value;
      onFilterChange();
    });

    // initial load
    resetTimer();
    currentSet = setSelector.value;
    questionLimit = countSelector.value;
    renderQuestion();
  })();
</script>
</body>
</html>
