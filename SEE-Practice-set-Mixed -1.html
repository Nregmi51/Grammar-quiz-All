<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEE English Grammar Practice - 10 Sets</title>
    <!-- jsPDF + autoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
    </script>
    <style>
        /* ─────────── RESET & BASE ─────────── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            /* CREAMY ANIMATED BACKGROUND */
            background: linear-gradient(145deg, #fdf6ec 0%, #f8ede0 30%, #f5e6d3 60%, #faf0e0 100%);
            background-size: 400% 400%;
            animation: creamyFlow 18s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes creamyFlow {
            0% {
                background-position: 0% 0%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
            100% {
                background-position: 0% 0%;
            }
        }

        /* subtle floating particles for extra creaminess */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 235, 210, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(245, 220, 190, 0.20) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 245, 230, 0.10) 0%, transparent 80%);
            pointer-events: none;
            z-index: 0;
            animation: shimmerGlow 12s ease-in-out infinite alternate;
        }

        @keyframes shimmerGlow {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 250, 242, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 52px;
            padding: 36px 42px 50px;
            box-shadow: 0 40px 80px -20px rgba(160, 120, 80, 0.30),
                0 12px 30px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.70);
            border: 1px solid rgba(255, 235, 210, 0.55);
            transition: all 0.25s ease;
        }

        /* ─── HEADER ─── */
        .main-header {
            background: linear-gradient(135deg, #d4a373, #e9c9a9, #f5dcc8);
            border-radius: 32px;
            padding: 28px 38px;
            margin-bottom: 34px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 14px 34px -10px rgba(180, 130, 80, 0.35);
            border: 1px solid rgba(255, 245, 225, 0.50);
            position: relative;
            overflow: hidden;
        }

        .main-header::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 235, 200, 0.25) 0%, transparent 60%);
            animation: headerGlow 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes headerGlow {
            0% {
                transform: translateX(-10%) scale(1);
            }
            100% {
                transform: translateX(10%) scale(1.2);
            }
        }

        .main-header h1 {
            position: relative;
            z-index: 1;
            font-size: 2.6rem;
            font-weight: 900;
            color: #3d281a;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 12px rgba(255, 220, 170, 0.30);
            margin: 0;
            line-height: 1.15;
        }

        .main-header .header-sub {
            position: relative;
            z-index: 1;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4d3422;
            background: rgba(255, 248, 235, 0.65);
            backdrop-filter: blur(6px);
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid rgba(255, 235, 200, 0.30);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 4px 16px rgba(160, 120, 80, 0.08);
        }

        .main-header .header-sub span {
            font-weight: 400;
            opacity: 0.75;
            margin: 0 4px;
        }

        .main-header .header-sub .email {
            font-weight: 800;
            color: #7a4f2a;
            letter-spacing: 0.5px;
            font-size: 1.1rem;
        }

        /* ─── STUDENT INFO ─── */
        .student-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 36px;
            background: rgba(255, 245, 230, 0.55);
            backdrop-filter: blur(6px);
            border-radius: 48px;
            padding: 18px 34px;
            margin-bottom: 28px;
            border: 1px solid rgba(220, 190, 160, 0.20);
            align-items: center;
            box-shadow: 0 4px 16px rgba(160, 120, 80, 0.05);
        }

        .student-info label {
            font-weight: 700;
            font-size: 1.15rem;
            color: #4d3422;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .student-info input {
            border: 2px solid #e8d5c0;
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            background: #fefcf7;
            transition: all 0.25s ease;
            font-family: inherit;
            color: #2d1f12;
            outline: none;
            width: 180px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .student-info input:focus {
            border-color: #c9a77b;
            box-shadow: 0 0 0 5px rgba(200, 160, 120, 0.15), inset 0 2px 6px rgba(0, 0, 0, 0.02);
            background: #ffffff;
        }

        .student-info input::placeholder {
            color: #c4b0a0;
            font-weight: 400;
        }

        /* ─── SET NAV ─── */
        .set-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
            padding: 6px 0;
        }

        .set-nav button {
            background: rgba(255, 248, 235, 0.70);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(200, 170, 140, 0.25);
            color: #4d3422;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 12px 22px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            flex: 0 0 auto;
            min-width: 64px;
            text-align: center;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .set-nav button:hover {
            background: #fffbf5;
            border-color: #c9a77b;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 28px -10px rgba(180, 140, 100, 0.25);
        }

        .set-nav button.active {
            background: linear-gradient(135deg, #d4a373, #e9c9a9);
            color: #2d1f12;
            border-color: #c9a77b;
            box-shadow: 0 10px 24px -8px rgba(180, 140, 100, 0.35);
            transform: scale(1.05);
            font-weight: 900;
        }

        .set-nav button .set-badge {
            display: inline-block;
            background: rgba(160, 120, 80, 0.12);
            border-radius: 40px;
            padding: 0 10px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-left: 6px;
            color: #7a4f2a;
        }

        .set-nav button.active .set-badge {
            background: rgba(255, 245, 225, 0.40);
            color: #3d281a;
        }

        /* ─── SET TITLE ─── */
        .set-title-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding: 0 4px;
        }

        .set-title-bar h2 {
            font-size: 2.4rem;
            font-weight: 900;
            color: #3d281a;
            margin: 0;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 8px rgba(180, 140, 100, 0.10);
        }

        .set-title-bar .score-badge {
            background: linear-gradient(135deg, #f5dcc8, #e9c9a9);
            color: #3d281a;
            font-weight: 800;
            font-size: 1.3rem;
            padding: 10px 28px;
            border-radius: 60px;
            box-shadow: 0 8px 20px -6px rgba(180, 140, 100, 0.25);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 245, 225, 0.40);
        }

        .set-title-bar .score-badge span {
            font-size: 1.6rem;
        }

        /* ─── SECTION LABEL ─── */
        .section-label {
            font-size: 1.5rem;
            font-weight: 800;
            color: #4d3422;
            margin: 34px 0 20px 0;
            padding: 8px 0 8px 20px;
            border-left: 8px solid #d4a373;
            display: flex;
            align-items: center;
            gap: 14px;
            letter-spacing: -0.2px;
        }

        .section-label small {
            font-weight: 500;
            font-size: 0.95rem;
            color: #8a7a6a;
            background: rgba(200, 170, 140, 0.12);
            padding: 4px 18px;
            border-radius: 40px;
        }

        /* ─── QUESTION GRID ─── */
        .question-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .q-item {
            background: rgba(255, 252, 247, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 22px;
            padding: 20px 28px 20px 28px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(220, 190, 160, 0.12);
            transition: all 0.25s ease;
        }

        .q-item:hover {
            border-color: rgba(200, 170, 140, 0.25);
            box-shadow: 0 10px 28px rgba(180, 140, 100, 0.06);
            background: rgba(255, 252, 247, 0.95);
        }

        .q-item .q-text {
            font-weight: 700;
            font-size: 1.25rem;
            color: #2d1f12;
            margin-bottom: 14px;
            display: flex;
            align-items: baseline;
            gap: 12px;
            line-height: 1.4;
        }

        .q-item .q-text .q-num {
            font-weight: 800;
            color: #7a4f2a;
            background: rgba(200, 170, 140, 0.15);
            padding: 0 14px;
            border-radius: 40px;
            font-size: 1rem;
            min-width: 38px;
            text-align: center;
            flex-shrink: 0;
        }

        /* ─── OPTIONS ─── */
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }

        .options .opt {
            background: #fcf8f2;
            border: 2px solid #e8d5c0;
            border-radius: 40px;
            padding: 8px 22px 8px 18px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #3d281a;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .options .opt:hover {
            background: #f7efe6;
            border-color: #c9a77b;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px -6px rgba(180, 140, 100, 0.12);
        }

        .options .opt.selected {
            background: linear-gradient(135deg, #d4a373, #e9c9a9);
            border-color: #c9a77b;
            color: #2d1f12;
            box-shadow: 0 6px 16px -4px rgba(180, 140, 100, 0.25);
            font-weight: 800;
        }

        .options .opt.correct-reveal {
            background: #d9e6d0;
            border-color: #7a9f6a;
            color: #2a4d1a;
            font-weight: 800;
        }

        .options .opt.wrong-reveal {
            background: #f5d6d0;
            border-color: #c97a6a;
            color: #6d2a1a;
            font-weight: 800;
        }

        .options .opt .opt-label {
            font-weight: 500;
            opacity: 0.60;
            font-size: 0.85rem;
        }

        .options .opt.selected .opt-label {
            opacity: 0.75;
            color: rgba(60, 40, 25, 0.70);
        }

        /* ─── Q10 INPUT ─── */
        .q10-input {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        .q10-input input {
            flex: 1 1 320px;
            padding: 12px 22px;
            border: 2px solid #e8d5c0;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            background: #fefcf7;
            transition: all 0.25s ease;
            font-family: inherit;
            color: #2d1f12;
            outline: none;
            min-width: 180px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .q10-input input:focus {
            border-color: #c9a77b;
            box-shadow: 0 0 0 5px rgba(200, 160, 120, 0.12), inset 0 2px 6px rgba(0, 0, 0, 0.02);
            background: #ffffff;
        }

        .q10-input input.correct {
            border-color: #7a9f6a;
            background: #f2f9ed;
        }

        .q10-input input.wrong {
            border-color: #c97a6a;
            background: #fdf2ef;
        }

        .q10-input .answer-hint {
            font-size: 1.0rem;
            font-weight: 700;
            color: #7a6a5a;
            padding: 4px 18px;
            border-radius: 40px;
            background: rgba(160, 120, 80, 0.06);
            display: none;
        }

        .q10-input .answer-hint.show {
            display: inline-block;
        }

        .q10-input .answer-hint.correct-hint {
            color: #4a7a3a;
            background: #ecf5e6;
        }

        .q10-input .answer-hint.wrong-hint {
            color: #b05a4a;
            background: #f5e6e0;
        }

        /* ─── ACTION BAR ─── */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 38px;
            padding-top: 28px;
            border-top: 2px dashed rgba(200, 170, 140, 0.20);
        }

        .action-bar .btn {
            padding: 14px 34px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            letter-spacing: 0.3px;
        }

        .action-bar .btn:active {
            transform: scale(0.96);
        }

        .btn-check {
            background: linear-gradient(135deg, #d4a373, #c9a77b);
            color: #2d1f12;
            box-shadow: 0 10px 24px -8px rgba(180, 140, 100, 0.30);
        }
        .btn-check:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px -10px rgba(180, 140, 100, 0.40);
        }

        .btn-reset {
            background: #f5ede6;
            color: #4d3422;
            border: 2px solid #e8d5c0;
        }
        .btn-reset:hover {
            background: #ede0d6;
            border-color: #c9a77b;
            transform: translateY(-2px);
        }

        .btn-show {
            background: #fffcf7;
            color: #7a4f2a;
            border: 2px solid #d4a373;
        }
        .btn-show:hover {
            background: #fdf6ed;
            transform: translateY(-2px);
            box-shadow: 0 10px 22px -8px rgba(180, 140, 100, 0.15);
        }

        .btn-clear {
            background: #f5e6e0;
            color: #7a3a2a;
            border: 2px solid #dbb0a0;
        }
        .btn-clear:hover {
            background: #f0dcd4;
            transform: translateY(-2px);
        }

        .btn-export {
            background: linear-gradient(135deg, #8fb08a, #7a9f6a);
            color: #fff;
            border: none;
            box-shadow: 0 10px 24px -8px rgba(120, 160, 100, 0.30);
        }
        .btn-export:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px -10px rgba(120, 160, 100, 0.40);
        }

        /* ─── RESULTS PANEL ─── */
        .results-panel {
            margin-top: 34px;
            padding: 24px 32px;
            border-radius: 32px;
            background: linear-gradient(135deg, #fcf5ed, #f8ede2);
            border: 2px solid rgba(200, 170, 140, 0.15);
            box-shadow: 0 10px 28px -10px rgba(180, 140, 100, 0.08);
        }

        .results-panel h3 {
            font-size: 1.7rem;
            font-weight: 900;
            color: #3d281a;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
        }

        .results-panel .result-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 48px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d1f12;
        }

        .results-panel .result-summary span {
            background: rgba(255, 252, 247, 0.60);
            padding: 6px 22px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 245, 225, 0.30);
        }

        .results-panel .result-detail {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            font-size: 1.05rem;
        }

        .results-panel .result-detail .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 252, 247, 0.50);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
        }

        .results-panel .result-detail .detail-item .status-icon {
            font-size: 1.4rem;
        }

        .results-panel .result-detail .detail-item.correct {
            border-left: 6px solid #7a9f6a;
        }
        .results-panel .result-detail .detail-item.wrong {
            border-left: 6px solid #c97a6a;
        }
        .results-panel .result-detail .detail-item.unanswered {
            border-left: 6px solid #d4a373;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 800px) {
            .app-container {
                padding: 20px 18px 30px;
                border-radius: 32px;
            }
            .main-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 20px 24px;
            }
            .main-header h1 {
                font-size: 1.9rem;
            }
            .main-header .header-sub {
                font-size: 1rem;
                padding: 8px 20px;
            }
            .student-info {
                flex-direction: column;
                align-items: stretch;
                padding: 16px 22px;
            }
            .student-info label {
                font-size: 1rem;
                flex-wrap: wrap;
            }
            .student-info input {
                width: 100%;
                font-size: 0.95rem;
            }
            .set-title-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }
            .set-title-bar h2 {
                font-size: 1.8rem;
            }
            .set-nav button {
                padding: 10px 16px;
                font-size: 0.95rem;
                min-width: 50px;
            }
            .q-item {
                padding: 16px 18px;
            }
            .q-item .q-text {
                font-size: 1.05rem;
            }
            .options .opt {
                padding: 6px 16px 6px 12px;
                font-size: 0.95rem;
            }
            .action-bar .btn {
                padding: 12px 24px;
                font-size: 0.95rem;
                flex: 1 1 auto;
                justify-content: center;
            }
            .q10-input input {
                min-width: 140px;
                flex: 1 1 200px;
                font-size: 0.95rem;
            }
            .results-panel .result-detail {
                grid-template-columns: 1fr;
            }
            .section-label {
                font-size: 1.2rem;
            }
            .set-title-bar .score-badge {
                font-size: 1.1rem;
                padding: 8px 20px;
            }
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 14px 10px 22px;
                border-radius: 24px;
            }
            .main-header {
                padding: 16px 16px;
            }
            .main-header h1 {
                font-size: 1.4rem;
            }
            .main-header .header-sub {
                font-size: 0.85rem;
                padding: 6px 14px;
                gap: 6px;
            }
            .set-nav button {
                padding: 8px 12px;
                font-size: 0.8rem;
                min-width: 40px;
            }
            .q-item .q-text {
                font-size: 0.92rem;
                flex-wrap: wrap;
            }
            .options .opt {
                font-size: 0.82rem;
                padding: 5px 12px 5px 10px;
            }
            .section-label {
                font-size: 1rem;
                padding-left: 12px;
                border-left-width: 5px;
            }
            .set-title-bar h2 {
                font-size: 1.4rem;
            }
            .action-bar {
                gap: 10px;
            }
            .action-bar .btn {
                font-size: 0.82rem;
                padding: 10px 16px;
            }
            .q10-input input {
                font-size: 0.85rem;
                padding: 10px 16px;
                min-width: 100px;
            }
            .results-panel {
                padding: 16px 18px;
            }
            .results-panel h3 {
                font-size: 1.3rem;
            }
            .results-panel .result-summary {
                font-size: 1rem;
                gap: 12px 20px;
            }
        }

        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(200, 170, 140, 0.08);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c0b0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c9a77b;
        }
    </style>

        }

        function renderSet() {
            const scrollY = window.scrollY;
            const active = document.activeElement;
            let activeInputIdx = null;
            if (active && active.tagName === 'INPUT' && active.dataset.q10 !== undefined) {
                activeInputIdx = parseInt(active.dataset.q10);
            }

            const container = document.getElementById('setContent');
            const s = SETS[currentSet];
            const sel = selections[currentSet];
            const rev = revealed[currentSet];
            const isSubmitted = submitted[currentSet] || false;
            const result = results[currentSet];

            let totalMarks = 0;
            let q9Correct = 0,
                q10Correct = 0;
            if (isSubmitted && result) {
                q9Correct = result.q9Correct;
                q10Correct = result.q10Correct;
                totalMarks = result.totalMarks;
            }

            const totalQ9 = s.q9.length;
            const totalQ10 = s.q10.length;
            const maxMarks = totalQ9 * 0.5 + totalQ10 * 1;

            let html = `
            <div class="set-title-bar">
              <h2>✦ Set ${s.id}</h2>
              <div class="score-badge">
                <span>🏆</span>
                ${isSubmitted ? `${totalMarks.toFixed(1)}/${maxMarks.toFixed(1)}` : '— / ' + maxMarks.toFixed(1)}
              </div>
            </div>
          `;

            // Q9
            html += `<div class="section-label">📌 Question 9 <small>Choose the best answer (0.5 mark each)</small></div>`;
            html += `<div class="question-grid">`;
            s.q9.forEach((q, i) => {
                const selected = sel.q9[i];
                const isRevealed = rev.q9[i] || false;
                const isCorrect = isSubmitted && result && result.q9CorrectDetails && result.q9CorrectDetails[i];
                const isWrong = isSubmitted && selected !== null && !isCorrect;
                const isUnanswered = isSubmitted && selected === null;

                html += `<div class="q-item">`;
                html += `<div class="q-text"><span class="q-num">${i+1}</span> ${q.q}</div>`;
                html += `<div class="options">`;
                q.opts.forEach(opt => {
                    let cls = 'opt';
                    if (selected === opt.value) cls += ' selected';
                    if (isSubmitted) {
                        if (opt.value === q.ans) cls += ' correct-reveal';
                        if (selected === opt.value && opt.value !== q.ans) cls += ' wrong-reveal';
                    } else if (isRevealed && opt.value === q.ans) {
                        cls += ' correct-reveal';
                    }
                    if (isSubmitted && selected === opt.value && isCorrect) cls += ' correct-reveal';
                    if (isSubmitted && selected === opt.value && isWrong) cls += ' wrong-reveal';
                    html += `<button class="${cls}" data-q9="${i}" data-val="${opt.value}" ${isSubmitted ? 'disabled style="cursor:default;opacity:0.8;"' : ''}>
                <span class="opt-label">${String.fromCharCode(65 + q.opts.indexOf(opt))}.</span> ${opt.label}
              </button>`;
                });
                html += `</div>`;
                if (isSubmitted) {
                    let statusText = '';
                    let color = '';
                    if (isCorrect) { statusText = '✅ Correct';
                        color = '#4a7a3a'; } else if (isWrong) { statusText = '❌ Incorrect (Answer: ' + q.ans + ')';
                        color = '#b05a4a'; } else { statusText = '⚠️ Not answered (Answer: ' + q.ans + ')';
                        color = '#b0803a'; }
                    html +=
                        `<div style="margin-top:8px;font-weight:700;font-size:1rem;color:${color};">${statusText}</div>`;
                }
                html += `</div>`;
            });
            html += `</div>`;

            // Q10
            html += `<div class="section-label" style="margin-top:34px;">✏️ Question 10 <small>Transformation (1 mark each)</small></div>`;
            html += `<div class="question-grid">`;
            s.q10.forEach((q, i) => {
                const val = sel.q10[i] || '';
                const isRevealed = rev.q10[i] || false;
                let isCorrect = false,
                    isWrong = false,
                    isUnanswered = false;
                if (isSubmitted && result) {
                    const det = result.q10CorrectDetails ? result.q10CorrectDetails[i] : false;
                    if (det === true) isCorrect = true;
                    else if (val.trim() !== '') isWrong = true;
                    else isUnanswered = true;
                }

                let inputCls = 'q10-input';
                let hintCls = 'answer-hint';
                if (isSubmitted) {
                    if (isCorrect) { inputCls += ' correct';
                        hintCls += ' show correct-hint'; } else if (isWrong) { inputCls += ' wrong';
                        hintCls += ' show wrong-hint'; } else { hintCls += ' show'; }
                } else if (isRevealed) {
                    inputCls += ' correct';
                    hintCls += ' show correct-hint';
                }

                html += `<div class="q-item">`;
                html += `<div class="q-text"><span class="q-num">${i+1}</span> ${q.instr}</div>`;
                html += `<div class="${inputCls}">`;
                html += `<input type="text" placeholder="Type your answer..." data-q10="${i}" value="${val}" ${isSubmitted ? 'disabled style="background:#f5ede6;cursor:default;"' : ''} />`;
                if (isSubmitted || isRevealed) {
                    html += `<span class="${hintCls}">${isRevealed || isSubmitted ? '✓ ' + q.ans : ''}</span>`;
                }
                html += `</div>`;
                if (isSubmitted) {
                    let statusText = '';
                    let color = '';
                    if (isCorrect) { statusText = '✅ Correct';
                        color = '#4a7a3a'; } else if (isWrong) { statusText = '❌ Incorrect (Answer: ' + q.ans + ')';
                        color = '#b05a4a'; } else { statusText = '⚠️ Not answered (Answer: ' + q.ans + ')';
                        color = '#b0803a'; }
                    html +=
                        `<div style="margin-top:8px;font-weight:700;font-size:1rem;color:${color};">${statusText}</div>`;
                }
                html += `</div>`;
            });
            html += `</div>`;

            // Results Panel
            if (isSubmitted && result) {
                const name = document.getElementById('studentName').value || 'Not provided';
                const roll = document.getElementById('studentRoll').value || 'Not provided';
                html += `
              <div class="results-panel">
                <h3>📊 Results for Set ${s.id}</h3>
                <div class="result-summary">
                  <span>👤 Name: ${name}</span>
                  <span>🔢 Roll: ${roll}</span>
                  <span>📝 Score: ${totalMarks.toFixed(1)} / ${maxMarks.toFixed(1)}</span>
                  <span>✅ MCQ: ${q9Correct}/${totalQ9}</span>
                  <span>✏️ Trans: ${q10Correct}/${totalQ10}</span>
                </div>
                <div style="margin-top:16px;display:flex;gap:14px;flex-wrap:wrap;">
                  <button class="btn btn-export" id="btnExportPDF">📄 Export Performance (PDF)</button>
                </div>
              </div>
            `;
            }

            // Action Bar
            html += `
            <div class="action-bar">
              <button class="btn btn-check" id="btnSubmit">${isSubmitted ? '✅ Submitted' : '📥 Submit Set'}</button>
              <button class="btn btn-reset" id="btnReset">🔄 Reset Set</button>
              <button class="btn btn-show" id="btnShow">👁 Show Answers</button>
              <button class="btn btn-clear" id="btnClear">🗑 Clear All</button>
            </div>
          `;

            container.innerHTML = html;

            window.scrollTo(0, scrollY);
            if (activeInputIdx !== null && !isSubmitted) {
                const input = container.querySelector(`.q10-input input[data-q10="${activeInputIdx}"]`);
                if (input) {
                    Promise.resolve().then(() => {
                        input.focus();
                        input.setSelectionRange(input.value.length, input.value.length);
                    });
                }
            }

            // Events
            if (!isSubmitted) {
                container.querySelectorAll('.opt').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.q9);
                        const val = btn.dataset.val;
                        const selState = selections[currentSet];
                        if (submitted[currentSet]) return;
                        if (selState.q9[idx] === val) {
                            selState.q9[idx] = null;
                        } else {
                            selState.q9[idx] = val;
                        }
                        revealed[currentSet].q9[idx] = false;
                        renderSet();
                    });
                });
            }

            if (!isSubmitted) {
                container.querySelectorAll('.q10-input input').forEach(inp => {
                    inp.addEventListener('input', () => {
                        const idx = parseInt(inp.dataset.q10);
                        const selState = selections[currentSet];
                        if (submitted[currentSet]) return;
                        selState.q10[idx] = inp.value;
                        revealed[currentSet].q10[idx] = false;
                        updateScoreBadge();
                    });
                });
            }

            document.getElementById('btnSubmit').addEventListener('click', () => {
                if (submitted[currentSet]) {
                    alert('This set has already been submitted.');
                    return;
                }
                const name = document.getElementById('studentName').value.trim();
                const roll = document.getElementById('studentRoll').value.trim();
                if (!name || !roll) {
                    alert('Please enter your Name and Roll Number before submitting.');
                    return;
                }
                const s = SETS[currentSet];
                const sel = selections[currentSet];
                let q9CorrectArr = [];
                let q9CorrectCount = 0;
                s.q9.forEach((q, i) => {
                    const isCorrect = sel.q9[i] === q.ans;
                    q9CorrectArr.push(isCorrect);
                    if (isCorrect) q9CorrectCount++;
                });
                let q10CorrectArr = [];
                let q10CorrectCount = 0;
                s.q10.forEach((q, i) => {
                    const userAns = sel.q10[i].trim().toLowerCase();
                    const correctAns = q.ans.trim().toLowerCase();
                    const isCorrect = userAns === correctAns;
                    q10CorrectArr.push(isCorrect);
                    if (isCorrect) q10CorrectCount++;
                });
                const totalMarks = q9CorrectCount * 0.5 + q10CorrectCount * 1;
                results[currentSet] = {
                    q9Correct: q9CorrectCount,
                    q10Correct: q10CorrectCount,
                    q9CorrectDetails: q9CorrectArr,
                    q10CorrectDetails: q10CorrectArr,
                    totalMarks: totalMarks,
                    maxMarks: s.q9.length * 0.5 + s.q10.length * 1
                };
                submitted[currentSet] = true;
                const rev = revealed[currentSet];
                s.q9.forEach((q, i) => rev.q9[i] = true);
                s.q10.forEach((q, i) => rev.q10[i] = true);
                renderSet();
            });

            document.getElementById('btnReset').addEventListener('click', () => {
                const sel = selections[currentSet];
                const rev = revealed[currentSet];
                sel.q9.fill(null);
                sel.q10.fill('');
                rev.q9.fill(false);
                rev.q10.fill(false);
                submitted[currentSet] = false;
                results[currentSet] = null;
                renderSet();
            });

            document.getElementById('btnShow').addEventListener('click', () => {
                if (submitted[currentSet]) {
                    alert('This set is already submitted. Answers are shown.');
                    return;
                }
                const s = SETS[currentSet];
                const rev = revealed[currentSet];
                const sel = selections[currentSet];
                s.q9.forEach((q, i) => {
                    rev.q9[i] = true;
                    if (!sel.q9[i]) sel.q9[i] = q.ans;
                });
                s.q10.forEach((q, i) => {
                    rev.q10[i] = true;
                    if (!sel.q10[i] || sel.q10[i].trim() === '') sel.q10[i] = q.ans;
                });
                renderSet();
            });

            document.getElementById('btnClear').addEventListener('click', () => {
                if (confirm('Clear all answers across ALL sets?')) {
                    SETS.forEach((s, si) => {
                        selections[si].q9.fill(null);
                        selections[si].q10.fill('');
                        revealed[si].q9.fill(false);
                        revealed[si].q10.fill(false);
                        submitted[si] = false;
                        results[si] = null;
                    });
                    renderSet();
                }
            });

            const exportBtn = document.getElementById('btnExportPDF');
            if (exportBtn) {
                exportBtn.addEventListener('click', () => {
                    generatePDF(currentSet);
                });
            }
        }

        function updateScoreBadge() {
            const container = document.getElementById('setContent');
            const badge = container?.querySelector('.score-badge');
            if (!badge) return;
            const s = SETS[currentSet];
            const isSubmitted = submitted[currentSet] || false;
            if (isSubmitted && results[currentSet]) {
                const total = results[currentSet].totalMarks;
                const max = results[currentSet].maxMarks;
                badge.innerHTML = `<span>🏆</span> ${total.toFixed(1)}/${max.toFixed(1)}`;
            } else {
                const max = s.q9.length * 0.5 + s.q10.length * 1;
                badge.innerHTML = `<span>🏆</span> — / ${max.toFixed(1)}`;
            }
        }

        function renderNav() {
            const nav = document.getElementById('setNav');
            nav.innerHTML = SETS.map((s, i) =>
                `<button class="${i === currentSet ? 'active' : ''}" data-idx="${i}">
              Set ${s.id}
              <span class="set-badge">${s.q9.length + s.q10.length}</span>
              ${submitted[i] ? '✅' : ''}
            </button>`
            ).join('');

            nav.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    if (idx !== currentSet) {
                        currentSet = idx;
                        renderAll();
                    }
                });
            });
        }

        function renderAll() {
            renderNav();
            renderSet();
        }

        // ═══════════════════════════════════════════════════════════════
        //  PDF GENERATION — compact A4
        // ═══════════════════════════════════════════════════════════════

        function generatePDF(setIdx) {
            const s = SETS[setIdx];
            const result = results[setIdx];
            if (!result) return;
            const name = document.getElementById('studentName').value || 'Not provided';
            const roll = document.getElementById('studentRoll').value || 'Not provided';
            const sel = selections[setIdx];

            const doc = new window.jspdf.jsPDF('p', 'mm', 'a4');
            const margin = 12;

            doc.setFontSize(14);
            doc.text(`Performance Report - Set ${s.id}`, margin, 18);
            doc.setFontSize(10);
            doc.text(`Name: ${name}`, margin, 26);
            doc.text(`Roll No.: ${roll}`, margin, 32);
            doc.text(`Score: ${result.totalMarks.toFixed(1)} / ${result.maxMarks.toFixed(1)}  |  MCQ: ${result.q9Correct}/${s.q9.length}  |  Trans: ${result.q10Correct}/${s.q10.length}`, margin, 38);

            const rows = [];
            s.q9.forEach((q, i) => {
                const userAns = sel.q9[i] || '(not answered)';
                const correctAns = q.ans;
                const isCorrect = result.q9CorrectDetails[i];
                const status = isCorrect ? '✔' : '✘';
                const marks = isCorrect ? '0.5' : '0';
                rows.push([
                    `MCQ ${i+1}`,
                    q.q,
                    userAns,
                    correctAns,
                    status,
                    marks
                ]);
            });
            s.q10.forEach((q, i) => {
                const userAns = sel.q10[i] || '(not answered)';
                const correctAns = q.ans;
                const isCorrect = result.q10CorrectDetails[i];
                const status = isCorrect ? '✔' : '✘';
                const marks = isCorrect ? '1' : '0';
                rows.push([
                    `T${i+1}`,
                    q.instr,
                    userAns,
                    correctAns,
                    status,
                    marks
                ]);
            });

            doc.autoTable({
                startY: 44,
                head: [
                    ['#', 'Question', 'Your Answer', 'Correct Answer', 'Status', 'Marks']
                ],
                body: rows,
                theme: 'striped',
                styles: {
                    fontSize: 7,
                    cellPadding: 1.5,
                    lineColor: [200, 180, 160],
                    lineWidth: 0.1,
                },
                headStyles: {
                    fillColor: [180, 140, 100],
                    fontSize: 8,
                    fontStyle: 'bold',
                    halign: 'center',
                },
                columnStyles: {
                    0: { cellWidth: 12, halign: 'center' },
                    1: { cellWidth: 60, halign: 'left' },
                    2: { cellWidth: 32, halign: 'left' },
                    3: { cellWidth: 32, halign: 'left' },
                    4: { cellWidth: 14, halign: 'center' },
                    5: { cellWidth: 12, halign: 'center' },
                },
                tableWidth: 'auto',
                margin: { left: margin, right: margin },
                didDrawPage: function(data) {
                    doc.setFontSize(7);
                    doc.text('Generated by SEE Grammar Practice', margin, doc.internal.pageSize.height - 6);
                }
            });

            doc.save(`Performance_Set${s.id}.pdf`);
        }

        // ═══════════════════════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════════════════════

        initState();
        renderAll();
    </script>

</body>
</html>
