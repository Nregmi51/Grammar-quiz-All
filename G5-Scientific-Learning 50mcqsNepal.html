<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🔬 Science Quiz for Kids</title>
    <style>
        /* ----- Global Reset & Font ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f9f0d1 0%, #f5e6ca 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .quiz-container {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 252, 240, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2), 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 2rem 1.8rem 2.2rem;
            border: 3px solid #ffe8b5;
            transition: all 0.2s;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #3d2b1a;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            letter-spacing: 1px;
        }
        h1 span {
            background: #f7d44a;
            padding: 0.2rem 1.5rem;
            border-radius: 60px;
            font-size: 1.6rem;
            box-shadow: inset 0 -4px 0 #c79a2e;
            font-weight: 800;
        }
        .subhead {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #5a3f2b;
            margin-top: -0.2rem;
            margin-bottom: 1.5rem;
            background: #feebc0;
            display: inline-block;
            padding: 0.3rem 2rem;
            border-radius: 40px;
            letter-spacing: 1px;
        }
        /* progress */
        .progress-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8d5b5;
            padding: 0.6rem 1.5rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            font-weight: 700;
            font-size: 1.2rem;
            color: #3d2b1a;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .progress-bar-bg {
            width: 100%;
            height: 16px;
            background: #d6b68b;
            border-radius: 30px;
            margin-top: 0.3rem;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f9b83a, #f58b1e);
            border-radius: 30px;
            transition: width 0.3s ease;
        }
        /* question card */
        .question-card {
            background: #fffcf2;
            border-radius: 50px;
            padding: 2rem 1.8rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05), 0 8px 0 #dbbd92;
            border: 2px solid #f3d9b0;
            margin-bottom: 1.2rem;
        }
        .question-emoji {
            font-size: 3.4rem;
            text-align: center;
            margin-bottom: 0.2rem;
        }
        .question-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2f1e0e;
            line-height: 1.4;
            margin-bottom: 1.8rem;
            text-align: center;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }
        .option-btn {
            background: #f5eee4;
            border: 3px solid #dbbc91;
            border-radius: 60px;
            padding: 1rem 1.5rem;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: left;
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 #b3926a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #2f1e0e;
            touch-action: manipulation;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b3926a;
        }
        .option-btn .opt-label {
            display: inline-block;
            background: #c9ad82;
            color: white;
            border-radius: 40px;
            padding: 0 1rem;
            font-size: 1.3rem;
            font-weight: 800;
            min-width: 2.6rem;
            text-align: center;
            line-height: 2.2rem;
        }
        .option-btn .opt-icon {
            font-size: 1.8rem;
        }
        .option-btn.correct {
            background: #b1d8b1;
            border-color: #2e7d32;
            box-shadow: 0 5px 0 #1e5a22;
        }
        .option-btn.wrong {
            background: #f8b5b5;
            border-color: #b13030;
            box-shadow: 0 5px 0 #7a2222;
        }
        .option-btn.disabled {
            opacity: 0.7;
            cursor: default;
        }
        .feedback {
            margin-top: 1.4rem;
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            padding: 0.8rem;
            border-radius: 60px;
            background: #f5e6d3;
            transition: background 0.2s;
        }
        /* navigation */
        .nav-area {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }
        .btn {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            border: none;
            border-radius: 60px;
            background: #f7b731;
            color: #2f1e0e;
            font-weight: 800;
            font-size: 1.4rem;
            box-shadow: 0 6px 0 #b87d1c;
            transition: all 0.08s ease;
            cursor: pointer;
            text-align: center;
            touch-action: manipulation;
            border: 2px solid #fad88a;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #b87d1c;
        }
        .btn-secondary {
            background: #7fa9c9;
            box-shadow: 0 6px 0 #4d6f89;
            border-color: #b3d0e8;
            color: white;
        }
        .btn-success {
            background: #5fad6b;
            box-shadow: 0 6px 0 #357a3f;
            border-color: #8fcb99;
            color: white;
        }
        .btn-restart {
            background: #e07b6e;
            box-shadow: 0 6px 0 #9e4f44;
            border-color: #f0a99e;
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #b87d1c;
            cursor: not-allowed;
        }
        /* result */
        .result-box {
            text-align: center;
            padding: 1.8rem 1rem;
        }
        .result-box .big-emoji {
            font-size: 6rem;
        }
        .result-box .score {
            font-size: 3.8rem;
            font-weight: 800;
            color: #3d2b1a;
        }
        .result-box .message {
            font-size: 2rem;
            font-weight: 700;
            margin: 0.8rem 0;
        }
        .result-box .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.2rem;
        }
        /* hide */
        .hidden {
            display: none !important;
        }
        /* responsive */
        @media (max-width: 500px) {
            .quiz-container { padding: 1.2rem 1rem; }
            h1 { font-size: 2.2rem; }
            .question-text { font-size: 1.5rem; }
            .option-btn { font-size: 1.2rem; padding: 0.8rem 1.2rem; }
            .feedback { font-size: 1.4rem; }
            .btn { font-size: 1.2rem; padding: 0.7rem 1.5rem; }
            .progress-area { font-size: 1rem; }
        }
        /* emoji decorations */
        .emoji-deco {
            display: inline-block;
            font-size: 2rem;
            margin-right: 6px;
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizApp">
    <!-- Header -->
    <div style="display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 0.3rem;">
        <h1>🔬 Science <span>Quiz</span></h1>
    </div>
    <div style="text-align: center;">
        <span class="subhead">🌟 Grade 5 · Scientific Learning</span>
    </div>

    <!-- Progress -->
    <div class="progress-area">
        <span id="questionCounter">Question 1 of 50</span>
        <span id="scoreDisplay">⭐ 0 correct</span>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
        </div>
    </div>

    <!-- Question Card -->
    <div id="questionCard" class="question-card">
        <div class="question-emoji" id="questionEmoji">🔍</div>
        <div class="question-text" id="questionText">Loading question...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="feedback" id="feedbackDisplay">💡 Pick an answer!</div>
    </div>

    <!-- Navigation -->
    <div class="nav-area">
        <button class="btn btn-secondary" id="nextBtn" disabled>➡️ Next</button>
        <button class="btn btn-restart" id="restartBtn">🔄 Restart</button>
    </div>

    <!-- Result Screen (hidden initially) -->
    <div id="resultScreen" class="result-box hidden">
        <div class="big-emoji">🎉</div>
        <div class="score" id="finalScore">0 / 50</div>
        <div class="message" id="finalMessage">Great job!</div>
        <div class="btn-group">
            <button class="btn btn-success" id="retryBtn">🔄 Try Again</button>
        </div>
    </div>
</div>
<script>
    (function() {
        // ---------- QUESTIONS DATA ----------
        // 50 questions, each: { q, options: [4], correctIndex: 0-3, emoji: '' }
        const questions = [
            // Part 1 (1-12)
            { q: 'Which of these helps us do "observation"?', options: ['Books', 'Sense organs', 'Running', 'Sleeping'], correctIndex: 1, emoji: '👀' },
            { q: 'Which organ helps you see the color and shape of a flower?', options: ['Ears', 'Tongue', 'Eyes', 'Skin'], correctIndex: 2, emoji: '🌸' },
            { q: 'If you want to know if a lemon is sour, which sense do you use?', options: ['Smell', 'Taste', 'Touch', 'Hearing'], correctIndex: 1, emoji: '🍋' },
            { q: 'What do we call the basic process of scientific learning?', options: ['Reading', 'Observation', 'Drawing', 'Talking'], correctIndex: 1, emoji: '🔍' },
            { q: 'Which organ helps you feel if a cup of tea is hot or cold?', options: ['Nose', 'Skin', 'Eyes', 'Ears'], correctIndex: 1, emoji: '☕' },
            { q: 'What is "learning by doing" called in science?', options: ['Observation', 'Experimentation', 'Inquiry', 'Homework'], correctIndex: 1, emoji: '🧪' },
            { q: 'If you use your nose to find out the smell of a rose, what are you doing?', options: ['Measuring', 'Observation', 'Drawing', 'Explaining'], correctIndex: 1, emoji: '🌹' },
            { q: 'Which property is hard to know just by looking at an object?', options: ['Color', 'Shape', 'Weight', 'Condition'], correctIndex: 2, emoji: '⚖️' },
            { q: 'What do we call the facts we collect from our environment?', options: ['Stories', 'Information', 'Dreams', 'Guesses'], correctIndex: 1, emoji: '📋' },
            { q: 'When you ask "Why does it rain?" to satisfy your curiosity, you are doing:', options: ['Inquiry', 'Measurement', 'Painting', 'Sleeping'], correctIndex: 0, emoji: '❓' },
            { q: 'What is the result called that we get at the end of an experiment?', options: ['Question', 'Conclusion', 'Guess', 'Start'], correctIndex: 1, emoji: '📊' },
            { q: 'Who can use the scientific learning process?', options: ['Only scientists', 'Only teachers', 'Everyone', 'Only doctors'], correctIndex: 2, emoji: '👨‍🔬' },
            // Part 2 (13-24)
            { q: 'Why are many lab tools made of glass?', options: ['Because it is cheap', 'Because it is transparent and doesn\'t erode', 'Because it is heavy', 'Because it is colorful'], correctIndex: 1, emoji: '🧪' },
            { q: 'Which tool is used to produce heat in a laboratory?', options: ['Bunsen burner', 'Measuring cylinder', 'Physical balance', 'Funnel'], correctIndex: 0, emoji: '🔥' },
            { q: 'What tool would you use to measure a small amount of liquid?', options: ['Ruler', 'Measuring cylinder', 'Clock', 'Tripod stand'], correctIndex: 1, emoji: '📏' },
            { q: 'Which of these is used to hold a flask while it is being heated?', options: ['Tripod stand', 'Funnel', 'Filter paper', 'Ruler'], correctIndex: 0, emoji: '🧫' },
            { q: 'What tool is best for measuring the mass (weight) of an object?', options: ['Thermometer', 'Physical balance', 'Measuring cylinder', 'Compass'], correctIndex: 1, emoji: '⚖️' },
            { q: 'If you need to pour a liquid into a bottle with a narrow neck, which tool helps?', options: ['Beaker', 'Funnel', 'Test tube', 'Tripod stand'], correctIndex: 1, emoji: '🧴' },
            { q: 'Which tool is used to mix and heat chemicals?', options: ['Beaker', 'Ruler', 'Physical balance', 'Standard weights'], correctIndex: 0, emoji: '🥣' },
            { q: 'What is a thermometer used for?', options: ['Measuring length', 'Measuring temperature', 'Measuring mass', 'Measuring volume'], correctIndex: 1, emoji: '🌡️' },
            { q: 'What tool helps us see tiny things more clearly?', options: ['Hand lens', 'Tripod stand', 'Bunsen burner', 'Filter paper'], correctIndex: 0, emoji: '🔬' },
            { q: 'What do we call a small amount of chemical used for testing?', options: ['Sample', 'Product', 'Tool', 'Mass'], correctIndex: 0, emoji: '🧪' },
            { q: 'Which tool is shaped like a cone and used for mixing chemicals?', options: ['Conical flask', 'Measuring cylinder', 'Physical balance', 'Ruler'], correctIndex: 0, emoji: '⚗️' },
            { q: 'Standard weights are used with which tool?', options: ['Thermometer', 'Physical balance', 'Bunsen burner', 'Funnel'], correctIndex: 1, emoji: '🏋️' },
            // Part 3 (25-32)
            { q: 'What is a schematic diagram?', options: ['A real photo', 'A symbolic drawing', 'A colorful painting', 'A 3D model'], correctIndex: 1, emoji: '📐' },
            { q: 'Which of these should you use to draw a schematic diagram?', options: ['Crayons', 'Sharp pencil and ruler', 'Sketch pens', 'Paintbrushes'], correctIndex: 1, emoji: '✏️' },
            { q: 'How many lines should you use to draw a part of the diagram?', options: ['Many thick lines', 'A single line', 'Dotted lines', 'Shaded lines'], correctIndex: 1, emoji: '📏' },
            { q: 'Which of these is NOT allowed in a schematic diagram?', options: ['Symbols', 'Labels', 'Shading and colors', 'Single lines'], correctIndex: 2, emoji: '🚫' },
            { q: 'How many dimensions does a schematic diagram have?', options: ['One', 'Two', 'Three', 'Four'], correctIndex: 1, emoji: '📐' },
            { q: 'When drawing a beaker (an open container), how should the top look?', options: ['Closed with a line', 'Open (no line across the top)', 'Covered with a circle', 'Shaded dark'], correctIndex: 1, emoji: '🧫' },
            { q: 'Why do we use schematic diagrams?', options: ['They look pretty', 'They are easy and clear to understand', 'They use many colors', 'They are real pictures'], correctIndex: 1, emoji: '💡' },
            { q: 'What is the most important thing about a schematic diagram\'s size?', options: ['It must be huge', 'It must be in correct proportion', 'It must be very small', 'It doesn\'t matter'], correctIndex: 1, emoji: '📐' },
            // Part 4 (33-50)
            { q: 'What is the total amount of matter in an object called?', options: ['Volume', 'Mass', 'Length', 'Time'], correctIndex: 1, emoji: '⚖️' },
            { q: 'How many centimeters make 1 meter?', options: ['10', '100', '1000', '12'], correctIndex: 1, emoji: '📏' },
            { q: 'What is the unit used to measure the distance between two cities?', options: ['Millimeter', 'Centimeter', 'Meter', 'Kilometer'], correctIndex: 3, emoji: '🏙️' },
            { q: 'How many inches are in 1 foot?', options: ['10', '12', '100', '24'], correctIndex: 1, emoji: '👣' },
            { q: 'Which tool is used to measure the length of a book?', options: ['Ruler', 'Physical balance', 'Clock', 'Thermometer'], correctIndex: 0, emoji: '📚' },
            { q: 'How many hours are there in one full day?', options: ['12', '24', '60', '7'], correctIndex: 1, emoji: '⏰' },
            { q: 'What is the space occupied by an object called?', options: ['Mass', 'Volume', 'Length', 'Time'], correctIndex: 1, emoji: '🧊' },
            { q: 'What is the formula for the volume of a regular box?', options: ['Length + Breadth', 'Length x Breadth x Height', 'Length x 2', 'Mass x Volume'], correctIndex: 1, emoji: '📦' },
            { q: 'Which unit is used for measuring a large amount of liquid, like water in a jug?', options: ['Gram', 'Litre', 'Meter', 'Second'], correctIndex: 1, emoji: '💧' },
            { q: 'How many milliliters (ml) are in 1 liter?', options: ['10', '100', '1000', '500'], correctIndex: 2, emoji: '🧴' },
            { q: 'Which tool is used to measure time during a race?', options: ['Ruler', 'Stopwatch', 'Physical balance', 'Thermometer'], correctIndex: 1, emoji: '⏱️' },
            { q: '1000 grams is equal to:', options: ['1 gram', '10 kilograms', '1 kilogram', '100 kilograms'], correctIndex: 2, emoji: '⚖️' },
            { q: 'How many seconds are in 1 minute?', options: ['10', '24', '60', '100'], correctIndex: 2, emoji: '⏲️' },
            { q: 'What do you use to measure the volume of an irregular stone?', options: ['Liquid displacement method', 'A ruler', 'A clock', 'A thermometer'], correctIndex: 0, emoji: '🪨' },
            { q: 'What happens to the water level in a cylinder when you drop a stone in it?', options: ['It goes down', 'It rises', 'It stays the same', 'It disappears'], correctIndex: 1, emoji: '📈' },
            { q: 'Which is a traditional tool for measuring volume in Nepal?', options: ['Ruler', 'Maana and Paathi', 'Stopwatch', 'Meter scale'], correctIndex: 1, emoji: '🏔️' },
            { q: 'What is the smallest unit of length on a standard ruler?', options: ['Millimeter', 'Centimeter', 'Meter', 'Kilometer'], correctIndex: 0, emoji: '📏' },
            { q: 'To measure your height, which unit would you likely use?', options: ['Millimeter', 'Meter or Centimeter', 'Kilometer', 'Gram'], correctIndex: 1, emoji: '🧍' }
        ];

        // ----- DOM refs -----
        const questionCard = document.getElementById('questionCard');
        const questionEmoji = document.getElementById('questionEmoji');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackDisplay = document.getElementById('feedbackDisplay');
        const questionCounter = document.getElementById('questionCounter');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const progressFill = document.getElementById('progressFill');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');
        const resultScreen = document.getElementById('resultScreen');
        const finalScore = document.getElementById('finalScore');
        const finalMessage = document.getElementById('finalMessage');
        const retryBtn = document.getElementById('retryBtn');

        // ----- State -----
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let timer = null;
        let totalQuestions = questions.length;

        // ----- Functions -----
        function renderQuestion() {
            resultScreen.classList.add('hidden');
            questionCard.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            if (timer) clearTimeout(timer);

            const q = questions[currentIndex];
            questionEmoji.textContent = q.emoji || '🔍';
            questionText.textContent = q.q;
            questionCounter.textContent = `Question ${currentIndex+1} of ${totalQuestions}`;
            scoreDisplay.textContent = `⭐ ${score} correct`;
            const pct = ((currentIndex) / totalQuestions) * 100;
            progressFill.style.width = pct + '%';

            optionsContainer.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-label">${labels[idx]}</span> <span class="opt-icon">${getOptionIcon(idx)}</span> ${opt}`;
                btn.dataset.idx = idx;
                btn.addEventListener('click', optionClickHandler);
                optionsContainer.appendChild(btn);
            });

            feedbackDisplay.textContent = '💡 Pick an answer!';
            feedbackDisplay.style.background = '#f5e6d3';
            answered = false;
            document.querySelectorAll('.option-btn').forEach(b => {
                b.classList.remove('disabled', 'correct', 'wrong');
                b.disabled = false;
            });
            nextBtn.disabled = true;
            nextBtn.style.opacity = '0.5';
        }

        function getOptionIcon(idx) {
            const icons = ['🔴', '🔵', '🟢', '🟡'];
            return icons[idx] || '⚪';
        }

        function optionClickHandler(e) {
            if (answered) return;
            const btn = e.currentTarget;
            const selectedIdx = parseInt(btn.dataset.idx);
            const q = questions[currentIndex];
            const correct = selectedIdx === q.correctIndex;

            document.querySelectorAll('.option-btn').forEach(b => {
                b.disabled = true;
                b.classList.add('disabled');
            });

            document.querySelectorAll('.option-btn').forEach((b, i) => {
                if (i === q.correctIndex) b.classList.add('correct');
                else if (i === selectedIdx && !correct) b.classList.add('wrong');
            });

            if (correct) {
                score++;
                feedbackDisplay.textContent = '✅ Correct! Well done! 🎉';
                feedbackDisplay.style.background = '#b8e0b8';
            } else {
                feedbackDisplay.textContent = `❌ Oops! The right answer was ${['A','B','C','D'][q.correctIndex]}.`;
                feedbackDisplay.style.background = '#f8c8c8';
            }
            answered = true;
            scoreDisplay.textContent = `⭐ ${score} correct`;
            nextBtn.disabled = false;
            nextBtn.style.opacity = '1';

            if (currentIndex === totalQuestions - 1) {
                nextBtn.textContent = '🏁 Finish';
            }
        }

        function goToNext() {
            if (!answered) return;
            if (currentIndex === totalQuestions - 1) {
                showResult();
                return;
            }
            currentIndex++;
            renderQuestion();
            if (currentIndex === totalQuestions - 1) {
                nextBtn.textContent = '🏁 Finish';
            } else {
                nextBtn.textContent = '➡️ Next';
            }
        }

        function showResult() {
            questionCard.classList.add('hidden');
            nextBtn.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScore.textContent = `${score} / ${totalQuestions}`;
            const pct = (score / totalQuestions) * 100;
            let msg = '';
            let emoji = '';
            if (pct === 100) { msg = '🌟 Perfect! You\'re a Science Star!'; emoji = '🏆'; }
            else if (pct >= 80) { msg = '🎉 Excellent! Keep it up!'; emoji = '🌟'; }
            else if (pct >= 60) { msg = '👍 Good job! You know a lot!'; emoji = '😊'; }
            else if (pct >= 40) { msg = '📖 Keep learning, you\'re getting there!'; emoji = '💪'; }
            else { msg = '🤔 Let\'s review and try again!'; emoji = '🔁'; }
            finalMessage.textContent = `${emoji} ${msg}`;
            progressFill.style.width = '100%';
            scoreDisplay.textContent = `⭐ ${score} correct`;
        }

        function restartQuiz() {
            if (timer) clearTimeout(timer);
            currentIndex = 0;
            score = 0;
            answered = false;
            resultScreen.classList.add('hidden');
            questionCard.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
            nextBtn.textContent = '➡️ Next';
            renderQuestion();
        }

        // ----- Event Listeners -----
        nextBtn.addEventListener('click', goToNext);
        restartBtn.addEventListener('click', restartQuiz);
        retryBtn.addEventListener('click', restartQuiz);

        // ----- Initialize -----
        renderQuestion();
    })();
</script>
</body>
</html>
